<!DOCTYPE html><html data-framework="game" lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>打怪升级</title>
<!-- 单文件版：CSS/JS 已内联，进化Boss 为两阶段机制。图片素材走网络地址，联网运行效果最佳 -->
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1a1030;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #fff;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.stage-wrap {
  position: absolute;
  inset: 0;
}

.stage {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

/* ---------- HUD ---------- */
.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 12px 14px;
  pointer-events: none;
  z-index: 5;
}

.hud-left {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 42%;
}

.hp-row, .exp-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-label {
  font-size: 13px;
  font-weight: 700;
  width: 30px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.hp-bar, .exp-bar {
  flex: 1;
  height: 14px;
  border-radius: 7px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.25);
  overflow: hidden;
}

.hp-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ff5a5a, #ff9a5a);
  transition: width 0.2s;
}

.exp-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4ad9ff, #6ee7ff);
  transition: width 0.2s;
}

.hud-right {
  display: flex;
  gap: 10px;
}

/* ---------- 第 2、3 关击杀进度 HUD ---------- */
.stage-progress {
  position: absolute;
  top: 64px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  pointer-events: none;
  font-size: 14px;
  font-weight: 800;
  color: #ffd24a;
  text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,210,80,0.5);
  border-radius: 12px;
  padding: 6px 14px;
}

.stage-progress.hidden { display: none; }
.stage-progress b { color: #fff; }

/* ---------- Boss HUD ---------- */
.boss-hud {
  position: absolute;
  top: 64px;
  left: 14px;
  right: 14px;
  z-index: 6;
  pointer-events: none;
}

.boss-hud.hidden { display: none; }

.boss-name {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #ff9ae6;
  text-shadow: 0 2px 8px rgba(120,20,90,0.7);
  margin-bottom: 4px;
}

.boss-bar {
  height: 16px;
  border-radius: 8px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,150,230,0.5);
  overflow: hidden;
}

.boss-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ff5ad0, #b58cff);
  transition: width 0.15s linear;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 48px;
  padding: 4px 8px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
}

.stat-num {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.1;
  color: #ffd24a;
}

.stat-label {
  font-size: 11px;
  opacity: 0.85;
}

/* ---------- 覆盖层 ---------- */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  padding: 24px;
  z-index: 10;
  background: rgba(20,10,40,0.72);
  backdrop-filter: blur(3px);
}

.overlay.hidden { display: none; }

/* ---------- 魔法导师剧情对话框 ---------- */
.story-screen {
  position: absolute;
  inset: 0;
  z-index: 12;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 18px;
  background: rgba(10, 5, 30, 0.55);
  cursor: pointer;
}
.story-screen.hidden { display: none; }
.story-box {
  background: linear-gradient(180deg, rgba(40,24,70,0.96), rgba(24,14,48,0.96));
  border: 2px solid #b78bff;
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 6px 24px rgba(120,60,220,0.35);
  text-align: left;
  color: #f2eaff;
}
.story-top { display: flex; align-items: center; gap: 12px; }
.story-portrait {
  width: 52px; height: 52px; flex: 0 0 auto;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe9b0, #7a4bd6);
  border: 2px solid #e8d5ff;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
.story-name { font-size: 15px; font-weight: 800; color: #ffd87a; letter-spacing: 1px; }
.story-step { font-size: 11px; color: #b9a6e0; }
.story-text { margin: 10px 2px 4px; font-size: 15px; line-height: 1.65; min-height: 3.2em; }
.story-hint { text-align: right; font-size: 11px; color: #9d8cc9; }
.story-choices { display: flex; gap: 10px; margin-top: 10px; }
.story-choice-btn {
  flex: 1;
  padding: 10px 8px;
  border: 1.5px solid #ffd87a;
  border-radius: 10px;
  background: rgba(255,216,122,0.12);
  color: #ffe9b0;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.story-choice-btn:active { background: rgba(255,216,122,0.3); }

.title {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(180deg, #ffe27a, #ff9a3c);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 4px 18px rgba(255,150,40,0.35);
}

.subtitle {
  font-size: 16px;
  line-height: 1.7;
  opacity: 0.92;
}

.hall-pos {
  font-size: 16px;
  font-weight: 800;
  color: #ffd24a;
  background: rgba(255,210,80,0.12);
  border: 1px solid rgba(255,210,80,0.4);
  border-radius: 12px;
  padding: 8px 18px;
  letter-spacing: 1px;
}

.continue-btn {
  background: linear-gradient(180deg, #7ee6ff, #3aa8e0);
  box-shadow: 0 6px 0 #1a5a8a, 0 10px 24px rgba(0,0,0,0.4);
  color: #0a2a3a;
}
.continue-btn:disabled {
  filter: grayscale(0.8) brightness(0.7);
  cursor: not-allowed;
  box-shadow: none;
}

.btn {
  min-width: 200px;
  min-height: 56px;
  padding: 14px 32px;
  font-size: 20px;
  font-weight: 800;
  color: #2a1a0a;
  background: linear-gradient(180deg, #ffe27a, #ffb03c);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 6px 0 #b96a1a, 0 10px 24px rgba(0,0,0,0.4);
  transition: transform 0.08s, box-shadow 0.08s;
}

.btn:hover { filter: brightness(1.05); }
.btn:focus-visible { outline: 3px solid #6ee7ff; outline-offset: 2px; }
.btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #b96a1a, 0 4px 12px rgba(0,0,0,0.4);
}

.hint {
  font-size: 13px;
  opacity: 0.75;
  line-height: 1.6;
}

/* ---------- 结束页 ---------- */
.over-title {
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #ff7a5a;
  text-shadow: 0 3px 14px rgba(255,90,60,0.4);
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: min(90%, 420px);
}

.result-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 14px 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 14px;
}

.result-num {
  font-size: 28px;
  font-weight: 900;
  color: #ffd24a;
}

.result-label {
  font-size: 12px;
  opacity: 0.85;
}

@media (max-width: 480px) {
  .title { font-size: 36px; }
  .stat-num { font-size: 16px; }
  .stat { min-width: 42px; padding: 3px 6px; }
}

/* ---------- 技能栏 ---------- */
.skill-bar {
  position: absolute;
  bottom: 14px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 14px;
  z-index: 8;
  pointer-events: none;
}

.skill-btn {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: 18px;
  border: 2px solid rgba(255,255,255,0.35);
  background: rgba(20,10,40,0.6);
  color: #fff;
  cursor: pointer;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  touch-action: none;
  transition: transform 0.08s, box-shadow 0.1s, border-color 0.1s;
}

.skill-btn .skill-icon { font-size: 24px; line-height: 1; }
.skill-btn .skill-name { font-size: 11px; font-weight: 700; opacity: 0.9; }
.skill-btn .skill-key {
  position: absolute;
  top: 4px;
  left: 6px;
  font-size: 11px;
  font-weight: 800;
  color: #ffd24a;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.skill-btn .skill-cd {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 900;
  color: #fff;
  background: rgba(10,5,20,0.62);
  border-radius: 16px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}

.skill-btn:hover { border-color: rgba(255,255,255,0.7); }
.skill-btn:focus-visible { outline: 3px solid #6ee7ff; outline-offset: 2px; }
.skill-btn:active { transform: scale(0.94); }

/* 可用（就绪）高亮 */
.skill-btn:not(.cooling) {
  border-color: rgba(255,226,122,0.8);
  box-shadow: 0 0 12px rgba(255,200,80,0.5);
}

/* 冷却中：置灰 */
.skill-btn.cooling {
  filter: grayscale(0.7);
  border-color: rgba(255,255,255,0.2);
  box-shadow: none;
}

/* 激活中：发光 */
.skill-btn.active {
  border-color: #ffd24a;
  box-shadow: 0 0 18px rgba(255,210,80,0.9);
  animation: skillPulse 0.8s ease-in-out infinite;
}

@keyframes skillPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(255,210,80,0.7); }
  50% { box-shadow: 0 0 22px rgba(255,210,80,1); }
}

/* ---------- 跳过关卡按钮 ---------- */
.skip-btn {
  position: absolute;
  top: 64px;
  right: 14px;
  z-index: 8;
  min-height: 44px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 800;
  color: #2a1a0a;
  background: linear-gradient(180deg, #ffe27a, #ffb03c);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 3px 0 #b96a1a, 0 5px 12px rgba(0,0,0,0.35);
  touch-action: none;
  transition: transform 0.08s, filter 0.1s;
}

.skip-btn:hover { filter: brightness(1.05); }
.skip-btn:focus-visible { outline: 3px solid #6ee7ff; outline-offset: 2px; }
.skip-btn:active { transform: translateY(2px); }

/* Boss 战不可跳过：置灰禁用 */
.skip-btn.disabled {
  filter: grayscale(0.8) brightness(0.7);
  cursor: not-allowed;
  box-shadow: none;
}

/* ---------- 被动卡牌三选一 ---------- */
.passive-screen { z-index: 12; }

.passive-title {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(180deg, #ffe27a, #ff9a3c);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.card-row {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(92%, 520px);
  max-height: 62vh;
  overflow-y: auto;
  padding: 4px;
}

.card-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  padding: 14px 16px;
  min-height: 72px;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,226,122,0.5);
  border-radius: 16px;
  color: #fff;
  cursor: pointer;
  touch-action: none;
  transition: transform 0.08s, border-color 0.1s, box-shadow 0.1s;
}

.card-btn:hover { border-color: rgba(255,226,122,0.9); box-shadow: 0 0 14px rgba(255,200,80,0.4); }
.card-btn:focus-visible { outline: 3px solid #6ee7ff; outline-offset: 2px; }
.card-btn:active { transform: scale(0.97); }

.card-icon { font-size: 30px; line-height: 1; flex-shrink: 0; }

.card-name {
  display: block;
  font-size: 18px;
  font-weight: 800;
  color: #ffd24a;
  margin-bottom: 2px;
}

.card-desc {
  display: block;
  font-size: 13px;
  line-height: 1.5;
  opacity: 0.9;
}

@media (max-width: 480px) {
  .passive-title { font-size: 24px; }
  .card-name { font-size: 16px; }
  .card-desc { font-size: 12px; }
}

/* ---------- 武器面板（左下） ---------- */
.weapon-panel {
  position: absolute;
  left: 12px;
  bottom: 96px;
  z-index: 7;
  min-width: 180px;
  padding: 8px 10px;
  background: rgba(15,8,30,0.72);
  border: 1px solid rgba(255,226,122,0.4);
  border-radius: 12px;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.weapon-panel.hidden { display: none; }

.wp-title {
  font-size: 12px;
  font-weight: 800;
  color: #ffd24a;
  letter-spacing: 1px;
  margin-bottom: 2px;
}

.wp-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 12px;
  line-height: 1.3;
}

.wp-row .wp-name {
  flex: 1;
  color: #fff;
  font-weight: 700;
}

.wp-row .wp-val {
  color: #ffd24a;
  font-weight: 900;
  font-size: 14px;
  min-width: 28px;
  text-align: right;
}

.wp-row .wp-sub {
  color: rgba(255,255,255,0.75);
  font-size: 11px;
  min-width: 44px;
  text-align: right;
}

.wp-main .wp-name { color: #7ee6ff; }
.wp-sub2 .wp-name { color: #ffb03c; }

/* ---------- 创作者模式 ---------- */
.creator-btn {
  background: linear-gradient(180deg, #b58cff, #7a4fd6);
  color: #fff;
  box-shadow: 0 6px 0 #4a2a8a, 0 10px 24px rgba(0,0,0,0.4);
}
.creator-btn:active { box-shadow: 0 2px 0 #4a2a8a, 0 4px 12px rgba(0,0,0,0.4); }

.creator-row {
  display: flex;
  gap: 10px;
  width: min(92%, 520px);
}

.creator-input {
  flex: 1;
  min-height: 52px;
  padding: 0 14px;
  font-size: 18px;
  color: #fff;
  background: rgba(0,0,0,0.45);
  border: 2px solid rgba(255,226,122,0.5);
  border-radius: 14px;
  outline: none;
}
.creator-input:focus-visible { border-color: #ffd24a; }

.creator-confirm {
  min-width: 96px;
  min-height: 52px;
  padding: 0 18px;
  font-size: 18px;
}

.creator-msg {
  min-height: 20px;
  font-weight: 800;
}
.creator-msg.error {
  color: #ff7a5a;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

/* ---------- 创作者模式：自定义主角参数面板 ---------- */
.creator-pw-row { margin-bottom: 4px; }

.creator-custom {
  width: min(92%, 520px);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
  background: rgba(255,226,122,0.08);
  border: 1px solid rgba(255,226,122,0.4);
  border-radius: 14px;
  max-height: 46vh;
  overflow-y: auto;
}

.creator-custom.hidden { display: none; }

.creator-custom-title {
  font-size: 15px;
  font-weight: 800;
  color: #ffd24a;
  letter-spacing: 1px;
  text-align: center;
}

.creator-param-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.creator-param-label {
  flex-shrink: 0;
  min-width: 118px;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}

.creator-num {
  min-height: 48px !important;
  padding: 0 12px !important;
  font-size: 16px !important;
}

.creator-apply, .creator-restore, .creator-cancel {
  min-width: auto;
  min-height: 48px;
  padding: 10px 20px;
  font-size: 16px;
}

.creator-cancel {
  background: linear-gradient(180deg, #ff9a5a, #d66a3c);
  color: #fff;
  box-shadow: 0 6px 0 #8a3a1a, 0 10px 24px rgba(0,0,0,0.4);
}
.creator-cancel:active { box-shadow: 0 2px 0 #8a3a1a, 0 4px 12px rgba(0,0,0,0.4); }

.creator-copy-src {
  min-width: auto;
  min-height: 52px;
  padding: 12px 24px;
  font-size: 17px;
  background: linear-gradient(180deg, #7ee6ff, #3aa8e0);
  color: #0a2a3a;
  box-shadow: 0 6px 0 #1a5a8a, 0 10px 24px rgba(0,0,0,0.4);
}
.creator-copy-src:active { box-shadow: 0 2px 0 #1a5a8a, 0 4px 12px rgba(0,0,0,0.4); }

.creator-restore {
  background: linear-gradient(180deg, #b58cff, #7a4fd6);
  color: #fff;
  box-shadow: 0 6px 0 #4a2a8a, 0 10px 24px rgba(0,0,0,0.4);
}
.creator-restore:active { box-shadow: 0 2px 0 #4a2a8a, 0 4px 12px rgba(0,0,0,0.4); }

/* ---------- 创作者模式：保存方案 ---------- */
.creator-schemes {
  margin-top: 6px;
  padding-top: 10px;
  border-top: 1px dashed rgba(255,226,122,0.35);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.creator-save-row { width: 100%; }
.creator-save-row .creator-input { flex: 1; min-height: 48px; }
.creator-save-btn {
  min-width: auto;
  min-height: 48px;
  padding: 10px 16px;
  font-size: 15px;
}

.creator-scheme-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 32vh;
  overflow-y: auto;
}

.creator-scheme-empty {
  font-size: 13px;
  opacity: 0.7;
  text-align: center;
  padding: 8px 0;
}

.creator-scheme-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,226,122,0.35);
  border-radius: 10px;
}

.creator-scheme-name {
  flex-shrink: 0;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 800;
  color: #ffd24a;
}

.creator-scheme-meta {
  flex: 1;
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.creator-scheme-load, .creator-scheme-del {
  min-width: auto;
  min-height: 40px;
  padding: 6px 12px;
  font-size: 13px;
}

.creator-scheme-load {
  background: linear-gradient(180deg, #7ee6ff, #3aa8e0);
  box-shadow: 0 4px 0 #1a5a8a, 0 6px 14px rgba(0,0,0,0.35);
  color: #0a2a3a;
}
.creator-scheme-load:active { box-shadow: 0 1px 0 #1a5a8a, 0 3px 8px rgba(0,0,0,0.35); }

.creator-scheme-del {
  background: linear-gradient(180deg, #ff7a5a, #d63a1a);
  box-shadow: 0 4px 0 #7a1a0a, 0 6px 14px rgba(0,0,0,0.35);
  color: #fff;
}
.creator-scheme-del:active { box-shadow: 0 1px 0 #7a1a0a, 0 3px 8px rgba(0,0,0,0.35); }

/* ---------- 大厅：查看源码按钮 ---------- */
.src-view-btn {
  background: linear-gradient(180deg, #b58cff, #7a4fd6);
  color: #fff;

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

        { path: 'styles.css', label: 'styles.css' },
        { path: 'game.js', label: 'game.js' },
      ];
      const parts = [];
      for (const f of files) {
        try {
          const res = await fetch(f.path, { cache: 'no-store' });
          if (!res.ok) throw new Error(String(res.status));
          const text = await res.text();
          parts.push(`/* ===== ${f.label} ===== */\n${text}\n`);
        } catch (err) {
          parts.push(`/* ===== ${f.label}（加载失败） ===== */\n`);
        }
      }
      const src = parts.join('\n');
      let ok = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(src);
          ok = true;
        }
      } catch (err) { ok = false; }
      if (!ok) {
        // 降级：临时 textarea + execCommand
        try {
          const ta = document.createElement('textarea');
          ta.value = src;
          ta.style.position = 'fixed';

    window.addEventListener('resize', () => this.resize());

    // 预加载素材
    Promise.all([
      loadImage(ASSETS.hero),
      loadImage(ASSETS.monsterRed),
      loadImage(ASSETS.monsterGreen),
      loadImage(ASSETS.monsterPurple),
      loadImage(ASSETS.bossExtreme),
      loadImage(ASSETS.bg),
      loadImage(ASSETS.bossReaper),
      loadImage(ASSETS.bgReaper),
      loadImage(ASSETS.eliteBoar),
      loadImage(ASSETS.eliteGoblin),
    ]).then(([hero, red, green, purple, extreme, bg, reaper, bgReaper, eliteBoar, eliteGoblin]) => {
      this.images.hero = hero;
      this.images.red = red;
      this.images.green = green;
      this.images.purple = purple;
      this.images.extreme = extreme;
      this.images.bg = bg;
      this.images.bossReaper = reaper;
      this.images.bgReaper = bgReaper;
      this.images[ASSETS.eliteBoar] = eliteBoar;

      MONSTER_TYPES[0].imgObj = red;
      MONSTER_TYPES[1].imgObj = green;
      MONSTER_TYPES[2].imgObj = purple;
      this.render();
    });
  }

  resize() {
    const rect = this.root.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = Math.max(1, rect.width);
    this.H = Math.max(1, rect.height);
    this.canvas.width = Math.round(this.W * dpr);
    this.canvas.height = Math.round(this.H * dpr);
    this.canvas.style.width = this.W + 'px';
    this.canvas.style.height = this.H + 'px';
    this.ctx = this.canvas.getContext('2d');
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (this.state === 'playing') this.resetWorld();
    this.render();
  }

  start(fromSave) {

        { step: 1, text: '临行前，收下我的一份祝福吧——它会陪你走完整个旅程。', choices: true },

  // （已废弃：创作者模式不再直达最终 Boss「死神」关，改为从第 1 关开始逐关推进）

  // ---------- 第 6 关精英关卡 ----------
  // 精英怪分两波出场：第一波 3 只、第二波 3 只；每只不重叠、随机新角色、随机血（剩余血量标在身上）；
  // 精英怪向主角所处方向发射沿直线飞行的弹丸，命中造成伤害；
  // 只有第二波且场上仅剩 1 只时才进入狂暴状态加快发射弹丸（第一波不触发）。
  spawnEliteBattle() {
    this.boss = null;
    this.bossPhase = null;
    this.bossHud.classList.add('hidden');
    this.stageProgress.classList.remove('hidden');
    // 完整重置第 6 关所有状态：波次、场上对象、计时器，彻底避免开局因残留数据卡死
    this.eliteWave = 0; // 当前波次：0 | 1 | 2（0 表示尚未进入任何波次，第一波由 updateEliteBattle 统一刷出，确保进入关卡时不会因旧值残留而跳过首波）
    this.elites = [];
    this.eliteProjectiles = [];
    this.potions = [];
    this.monsters = [];
    this.bullets = [];
    this.coins = [];
    this.particles = [];
    this.floatingTexts = [];
    this.spawnTimer = 0;
    this.stageKills = 0;
    this.updateStageProgressHud();
    // 第一波由 updateEliteBattle 统一按固定槽位刷出（确保进入关卡时不会因旧值残留而跳过首波）
    this.bossBanner = 2.4;
    this.bossBannerText = '第 6 关 · 精英关卡';
    this.addFloat(this.W / 2, this.H / 2 - 40, '精英关卡！', '#ffd24a');
  }

  // 生成一波精英怪（count 只）：按固定槽位生成，确保不重叠且不会因随机检测失败卡死
  spawnEliteWave(count) {
    const W = this.W, H = this.H;
    const slots = [
      { x: W * 0.25, y: H * 0.22 },
      { x: W * 0.5, y: H * 0.3 },
      { x: W * 0.75, y: H * 0.22 },
    ];
    for (let i = 0; i < count && i < slots.length; i++) {
      const role = ELITE_ROLES[Math.floor(Math.random() * ELITE_ROLES.length)];
      const maxHp = 300 + Math.floor(Math.random() * 201); // 随机 300~500 血
      this.elites.push({
        x: slots[i].x, y: slots[i].y, r: 44,
        hp: maxHp, maxHp,
        img: role.img, color: role.color,
        shotTimer: 1.2 + Math.random() * 1.6, // 首次发射弹丸节奏错开
        enraged: false,
      });
    }
  }

  // 第一波全部被击败后进入第二波（带防重复触发保护）
  startEliteWave2() {
    if (this.eliteWave !== 1) return; // 防止同帧或跨帧重复触发
    this.eliteWave = 2;
    this.eliteProjectiles = []; // 清空第一波残留弹丸，避免跨波次残留
    this.spawnEliteWave(ELITE_WAVE2_COUNT);
    this.addFloat(this.W / 2, this.H / 2 - 40, '第二波精英怪来袭！', '#ff9ae6');
  }

  updateEliteBattle(dt) {
    const p = this.player;
    if (!p || !isFinite(p.x) || !isFinite(p.y)) return; // 主角状态异常时跳过本帧，防止卡死
    const leftCount = this.elites.length;
    // 第一波尚未登场（波次为 0）：立即按固定槽位刷出第一波 3 只精英怪
    if (this.eliteWave === 0) {
      this.eliteWave = 1;
      this.spawnEliteWave(ELITE_WAVE1_COUNT);
      return; // 本帧已刷出第一波，直接返回，避免同帧内重复处理
    }
    // 第一波全部被击败后进入第二波（仅当波次为 1 且场上无精英怪时触发一次）
    if (this.eliteWave === 1 && leftCount === 0) {
      this.startEliteWave2();
      return; // 本帧已刷出第二波，直接返回，避免同帧内重复处理
    }
    // 精英怪持续存活：每只独立计时周期性向主角发射弹丸；发射动作不会移除精英怪本身
    for (let i = 0; i < this.elites.length; i++) {
      const e = this.elites[i];
      if (!e || !isFinite(e.shotTimer)) e.shotTimer = ELITE_PROJECTILE_INTERVAL;
      // 只有第二波且场上仅剩 1 只时才进入狂暴状态（第一波不触发）
      e.enraged = this.eliteWave === 2 && leftCount <= ELITE_ENRAGE_LEFT;
      e.shotTimer -= dt;
      if (e.shotTimer <= 0) {
        this.fireEliteProjectile(e);
        // 发射后重置计时器，精英怪继续存活等待下一轮发射
        e.shotTimer = e.enraged ? ELITE_PROJECTILE_ENRAGE_INTERVAL : ELITE_PROJECTILE_INTERVAL;
      }
    }
    // 玩家子弹命中精英怪：扣精英怪血量、显示受击闪白与伤害飘字；主角不受该次攻击影响
    for (let i = this.elites.length - 1; i >= 0; i--) {
      const e = this.elites[i];
      if (!e) continue;
      let hit = false;
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (!b || b.fromBoss) continue;
        const dx = b.x - e.x, dy = b.y - e.y;
        if (dx * dx + dy * dy < (e.r + b.r) * (e.r + b.r)) {
          this.bullets.splice(j, 1);
          e.hp -= b.dmg;
          e.flash = 0.1;
          this.addFloat(b.x, b.y, `-${b.dmg}`, '#ffd24a');
          hit = true;
          break;
        }
      }
      if (hit && e.hp <= 0) {
        this.killElite(i);
      }
    }
    // 精英怪弹丸：沿直线飞行，命中主角执行完整伤害判定并立即销毁；飞出屏幕边界即移除，避免残留卡死
    for (let i = this.eliteProjectiles.length - 1; i >= 0; i--) {
      const pr = this.eliteProjectiles[i];
      // 安全兜底：弹丸对象损坏（NaN/Infinity）时直接移除，防止卡死
      if (!pr || !isFinite(pr.x) || !isFinite(pr.y) || !isFinite(pr.vx) || !isFinite(pr.vy)) {
        this.eliteProjectiles.splice(i, 1);
        continue;
      }
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      // 移动后再次校验：若因数值溢出导致 NaN/Infinity，立即移除
      if (!isFinite(pr.x) || !isFinite(pr.y)) {
        this.eliteProjectiles.splice(i, 1);
        continue;
      }
      // 飞出屏幕边界：立即移除，不残留
      if (pr.x < -40 || pr.x > this.W + 40 || pr.y < -40 || pr.y > this.H + 40) {
        this.eliteProjectiles.splice(i, 1);
        continue;
      }
      // 与主角碰撞判定：命中后主角扣血、受击反馈并立即销毁该弹丸（精英怪弹丸只伤害主角，不作用于精英怪自身）
      const dx = pr.x - p.x;
      const dy = pr.y - p.y;
      const hitR = pr.r + p.w / 2;
      if (dx * dx + dy * dy < hitR * hitR) {
        this.eliteProjectiles.splice(i, 1); // 无论是否金身，命中即销毁弹丸
        if (this.isInvincible()) {
          this.addFloat(p.x, p.y - p.w / 2 - 10, '免疫', '#ffd24a');
          continue;
        }
        this.hp -= pr.dmg;
        this.shake = 10;
        this.addFloat(p.x, p.y - p.w / 2 - 10, `-${pr.dmg} HP`, '#ff7a5a');
        this.spawnParticles(pr.x, pr.y, '#ff9a3c', 8);
        if (this.hp <= 0) {
          this.hp = 0;
          this.gameOver(false);
          return;
        }
      }
    }
  }

  // 精英怪向主角所处方向发射沿直线飞行的弹丸（含异常数据兜底，防止 NaN/Infinity 导致卡死）
  fireEliteProjectile(e) {
    const p = this.player;
    if (!p || !isFinite(p.x) || !isFinite(p.y)) return;
    if (!isFinite(e.x) || !isFinite(e.y)) return;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    if (!isFinite(d) || d <= 0) return;
    const vx = (dx / d) * ELITE_PROJECTILE_SPEED;
    const vy = (dy / d) * ELITE_PROJECTILE_SPEED;
    if (!isFinite(vx) || !isFinite(vy)) return;
    this.eliteProjectiles.push({
      x: e.x, y: e.y, vx, vy,
      r: ELITE_PROJECTILE_R,
      dmg: ELITE_PROJECTILE_DMG,
    });
  }

  killElite(idx) {
    const e = this.elites[idx];
    this.elites.splice(idx, 1);
    this.spawnParticles(e.x, e.y, e.color, 22);
    this.gainScore(50);
    this.stageKills++;
    this.addFloat(e.x, e.y, `+50`, '#ffd24a');
    // 精英怪低概率掉落治疗药水（回复较低，分瞬时与缓慢两种，缓慢回复多）
    if (Math.random() < 0.3) {
      const isInstant = Math.random() < 0.3; // 瞬时回复少（30%），缓慢回复多（70%）
      const type = isInstant ? 'instant' : 'slow';
      const value = isInstant ? 2 : 1; // 瞬时回复少、单次 2 点；缓慢回复多、每秒 1 点持续 3s
      const duration = isInstant ? 0 : 3; // 缓慢回复持续 3s
      this.potions.push({ x: e.x, y: e.y, vy: 80, type, value, duration, life: 8 });
      this.addFloat(e.x, e.y - 20, type === 'instant' ? '瞬时药水!' : '缓慢药水!', '#7ee6a0');
    }
    if (this.stageKills >= STAGE_KILL_GOAL[ELITE_BATTLE_STAGE]) {
      // 击败 4 只精英怪 -> 通关第 6 关，进入伪最终 Boss「死神」关
      this.eliteProjectiles = [];
      this.elites = [];
      this.addFloat(this.W / 2, this.H / 2 - 40, '第 6 关通关！', '#ffd24a');
      this.enterNextStage();
    } else {
      this.updateStageProgressHud();
    }
  }

  // ---------- 存档点 ----------
  saveKey() { return 'daguang_save_v1'; }
  saveCheckpoint() {
    try {
      const data = {
        stage: this.stage,
        bossPhase: this.boss ? this.bossPhase : null,
        bossName: this.boss ? this.boss.name : null,
        level: this.level, exp: this.exp, expNeed: this.expNeed,
        hp: this.hp, maxHp: this.maxHp,
        damage: this.damage, fireInterval: this.fireInterval,
        score: this.score, kills: this.kills,
        passiveChosen: this.passiveChosen,
        weaponChosen: this.weaponChosen,
        time: this.time,
      };
      localStorage.setItem(this.saveKey(), JSON.stringify(data));
    } catch (e) { /* ignore */ }
  }
  loadCheckpoint() {
    try {
      const raw = localStorage.getItem(this.saveKey());
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.stage) return null;
      return d;
    } catch (e) { return null; }
  }
  applySave(d) {
    this.stage = d.stage || 1;
    this.level = d.level || 1;
    this.exp = d.exp || 0;
    this.expNeed = d.expNeed || 30;
    this.hp = d.hp != null ? d.hp : this.maxHp;
    this.maxHp = d.maxHp || this.maxHp;
    this.damage = d.damage || this.damage;
    this.fireInterval = d.fireInterval || this.fireInterval;
    this.score = d.score || 0;
    this.kills = d.kills || 0;
    this.time = d.time || 0;
    this.passiveChosen = d.passiveChosen || null;
    this.weaponChosen = d.weaponChosen || null;
    this.updateWeaponPanel();
    if (this.weaponChosen) this.weaponPanel.classList.remove('hidden');
    // Boss 关存档：直接重生对应 Boss
    if (d.bossPhase === 'boss') this.spawnBoss();
    else if (d.bossPhase === 'pseudo') { this.spawnBoss(); this.transformToPseudo(); }
    else if (d.bossPhase === 'reaper') this.spawnReaperBoss();
    else if (d.bossPhase === 'evolved') this.spawnEvolvedBoss();
    else if (d.bossPhase === 'extreme') this.spawnExtremeBoss();
    else {
      // 小怪关：进入对应关卡（重置本关击杀进度）
      this.stageKills = 0;
      this.eliteSpawnTimer = ELITE_SPAWN_INTERVAL;
      if (this.stage >= 2) this.damage = Math.max(this.damage, 5);
      const goal = STAGE_KILL_GOAL[this.stage];
      this.addFloat(this.W / 2, this.H / 2 - 20, `继续 · 第 ${this.stage} 关`, '#7ee6ff');
    }
    this.updateSkillBar();
    this.updateStageProgressHud();
    this.updateHud();
  }
  stageLabel() {
    if (this.boss) return `Boss · ${this.boss.name}`;
    return `第 ${this.stage} 关`;
  }
  refreshHall() {
    const save = this.loadCheckpoint();
    const hallPos = this.hallPos;
    const hallBtns = this.hallBtns;
    if (!hallPos || !hallBtns) return;
    if (save) {
      hallPos.textContent = save.bossName ? `已到达 · Boss「${save.bossName}」` : `已到达 · 第 ${save.stage} 关`;
      hallBtns.continue.disabled = false;
      hallBtns.continue.textContent = '继续挑战';
    } else {
      hallPos.textContent = '尚无进度 · 从第 1 关开始';
      hallBtns.continue.disabled = true;
      hallBtns.continue.textContent = '继续挑战';
    }
  }
  backToHall() {
    this.state = 'idle';
    cancelAnimationFrame(this.raf);
    this.raf = 0;
    this.bossHud.classList.add('hidden');
    this.overScreen.classList.add('hidden');
    this.passiveScreen.classList.add('hidden');
    this.weaponScreen.classList.add('hidden');
    this.creatorScreen.classList.add('hidden');
    this.startScreen.classList.remove('hidden');
    this.refreshHall();
    this.render();
  }

  gameOver(victory) {
    this.state = 'over';
    cancelAnimationFrame(this.raf);
    this.raf = 0;
    this.bossHud.classList.add('hidden');
    const q = (k) => this.overScreen.querySelector(`[data-k="${k}"]`);
    q('overTitle').textContent = victory ? '挑战胜利' : '挑战结束';
    q('lv').textContent = this.level;
    q('kill').textContent = this.kills;
    q('score').textContent = this.score;
    this.overScreen.classList.remove('hidden');
    this.updateSkipBtn();
    this.render();
  }

  loop = (t) => {
    if (this.state !== 'playing' || this.passivePending || this.weaponPending || this.storyPending) return;
    let dt = (t - this.lastT) / 1000;
    this.lastT = t;
    if (dt > 0.05) dt = 0.05;
    this.update(dt);
    this.render();
    this.raf = requestAnimationFrame(this.loop);
  };

  // ---------- Boss 关 ----------
  spawnBoss() {
    const cfg = BOSS_ETERNITY;
    this.boss = {
      name: cfg.name,
      hp: cfg.hp,
      maxHp: cfg.hp,
      x: this.W / 2,
      y: 120,
      r: 70,
      phase: 0,
      flash: 0,
      attackCd: 2,
    };
    this.bossPhase = 'boss';
    this.bossBanner = 2.4;
    this.bossBannerText = 'BOSS · Eternity';
    this.bossHud.classList.remove('hidden');
    this.bossHud.querySelector('[data-k="bossName"]').textContent = cfg.name;
    this.updateBossHud();
    this.saveCheckpoint();
    this.addFloat(this.W / 2, this.H / 2 - 40, 'BOSS 登场！', '#ff5ad0');
  }

  transformToPseudo() {
    // Eternity 消失，转化为伪·永恒
    const bx = this.boss.x;
    const by = this.boss.y;
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 80 + Math.random() * 260;
      this.particles.push({
        x: bx, y: by,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.6 + Math.random() * 0.4, color: '#b58cff', size: 3 + Math.random() * 5,
      });
    }
    const cfg = BOSS_PSEUDO;
    this.boss = {
      name: cfg.name,
      hp: cfg.hp,
      maxHp: cfg.hp,
      x: this.W / 2,
      y: 140,
      r: 56,
      phase: 0,
      flash: 0,
      attackCd: 1.5,
    };
    this.bossPhase = 'pseudo';
    this.pseudoCd = PSEUDO_INTERVAL; // 首次攻击前等待一个完整间隔
    this.pseudoCharge = 0;
    this.bossBanner = 2.4;
    this.bossBannerText = '伪·永恒';
    this.bossHud.querySelector('[data-k="bossName"]').textContent = cfg.name;
    this.updateBossHud();
    this.saveCheckpoint();
    this.addFloat(this.W / 2, this.H / 2 - 40, '转化为 伪·永恒', '#eafcff');
  }

  // 击败伪·永恒后进入下一关：第 2~3 关小怪关，通关第 3 关强制进入 Boss「极限」；击败极限后进入第 4~5 关小怪关，通关第 5 关进入伪最终 Boss「死神」
  enterNextStage() {
    // 清空场上残留怪物/子弹/金币，保留玩家成长与分数
    this.monsters = [];
    this.bullets = [];
    this.coins = [];
    this.potions = [];
    this.spawnTimer = 0;
    const nextStage = this.stage + 1;
    if (nextStage > MAX_STAGE) {
      // 已通关第 5 关 -> 进入伪最终 Boss 关「死神」（背景随出场显现）
      this.spawnReaperBoss();
      return;
    }
    // 第 3 关结束后强制进入 Boss「极限」战（不再先打第 4、5 关）
    if (this.stage === 3) {
      this.spawnExtremeBoss();
      return;
    }
    this.stage = nextStage;
    // 进入新关卡时重置本关击杀进度与精英怪刷新节奏
    this.stageKills = 0;
    this.eliteSpawnTimer = ELITE_SPAWN_INTERVAL;
    this.saveCheckpoint(); // 存档点：进入新关卡自动记录
    // 进入第 2 关时：初始攻击为 5，之后每升一级 +1.5（覆盖第 1 关的 +20% 成长）
    if (this.stage === 2) {
      this.damage = 5;
    }
    // 第二关结束后弹出副武器三选一（首次进入第 3 关时触发）；创作者模式跳过关卡时直接赋予，不弹出三选一界面
    if (this.stage === 3 && !this.weaponChosen) {
      if (this.creatorModeOn) {
        // 创作者模式：直接赋予突击步枪（不暂停游戏、不弹出三选一）
        this.weaponChosen = 'rifle';
        this.weaponPending = false;
        this.weaponScreen.classList.add('hidden');
        this.weaponPanel.classList.remove('hidden');
        this.updateWeaponPanel();
        const w = SECONDARY_WEAPONS['rifle'];
        this.addFloat(this.W / 2, this.H / 2 - 40, `获得副武器 · ${w.name}`, '#ffd24a');
      } else {
        this.showWeaponSelect();
      }
    }
    // 破釜沉舟：每关限一次，进入新关卡重置
    this.breakUsedThisStage = false;
    this.waveFlash = 0.9;
    const goal = STAGE_KILL_GOAL[this.stage];
    const bannerText = goal ? `第 ${this.stage} 关 · 击败 ${goal} 只怪物通关！` : (this.stage === ELITE_STAGE ? `第 ${this.stage} 关 · 精英怪登场！` : `第 ${this.stage} 关 · 怪物更厚更多！`);
    this.addFloat(this.W / 2, this.H / 2 - 20, bannerText, '#ff9a5a');
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      this.particles.push({ x: this.W / 2, y: this.H / 2, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, life: 0.6, color: '#ffb03c', size: 5 });
    }
    this.updateSkipBtn();
  }

  // 伪最终 Boss「死神」登场（通关第 5 关后）：背景随出场显现，拥有闪现横劈 / 裂缝诅咒 / 黑洞三种攻击

    this.addFloat(this.W / 2, this.H / 2 - 40, '伪最终 Boss · 死神登场！', '#ff4a4a');
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * Math.PI * 2;
      this.particles.push({ x: this.W / 2, y: this.H / 2, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, life: 0.7, color: '#ff4a4a', size: 5 });

  // 第 6 关「进化Boss」登场（击败死神后）：第一阶段 500 血，不移动不攻击，周期性召唤第 1 关量级的小怪
  spawnEvolvedBoss() {
    const cfg = BOSS_EVOLVED;
    this.boss = {
      name: cfg.name,
      hp: cfg.hp1,
      maxHp: cfg.hp1,
      x: this.W / 2,
      y: 160,
      r: 70,
      evoPhase: 1, // 1 = 第一阶段（500 血召唤关），2 = 第二阶段（300 血弹幕形态）
      phase: 0,
      flash: 0,
      attackCd: 1.5,
      summonTimer: EVOLVED_SUMMON_INTERVAL, // 第一阶段小怪召唤计时
    };
    this.bossPhase = 'evolved';
    // 缓行领域初始状态（进入第二阶段时激活）
    this.slowFieldActive = 0;
    this.slowFieldElapsed = 0;
    this.slowFieldBlockUsed = false;
    this.stage = ELITE_BATTLE_STAGE; // 第 6 关：出怪量与第 2 关大抵相同
    // 清理死神残留状态
    this.bgReaperAlpha = 0;
    this.reaperBlackhole = null;
    this.reaperBeams = [];
