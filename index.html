    this.bossBannerText = 'BOSS · 进化Boss';
    // 第四幕：幕后黑手现身，导师点明两个形态
    this.showStory('evolved', [
      { step: 4, text: '就是它——吞噬了无数魔物之力的「进化Boss」，一切的黑手！' },
      { step: 4, text: '它有两个形态：第一形态只会召唤小怪。打空它的护体魔血，真正的战斗才会开始！' },
    ]);
    this.bossHud.classList.remove('hidden');
    this.bossHud.querySelector('[data-k="bossName"]').textContent = cfg.name;
    this.updateBossHud();
    this.saveCheckpoint();
    this.addFloat(this.W / 2, this.H / 2 - 40, '第 6 关 · 进化Boss 登场！', '#ffb03c');
    this.addFloat(this.W / 2, this.H / 2, `第一阶段：击破 ${cfg.hp1} 血！`, '#ffd24a');
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * Math.PI * 2;
      this.particles.push({ x: this.W / 2, y: this.H / 2, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, life: 0.7, color: '#ffb03c', size: 5 });
    }
    this.updateSkipBtn();
  }

  // 第一阶段召唤的小怪：第 1 关量级（血量为基准值，不随关卡加厚）
  spawnStage1Minion() {
    const idx = Math.floor(Math.random() * MONSTER_TYPES.length);
    const t = MONSTER_TYPES[idx];
    const r = t.r;
    const hp = Math.max(1, Math.round(t.hp)); // 第 1 关量级：血量不加成
    this.monsters.push({
      type: t,
      x: r + Math.random() * (this.W - r * 2),
      y: -r,
      r,
      hp,
      maxHp: hp,
      speed: t.speed * (0.85 + Math.random() * 0.3),
      exp: t.exp,
      dmg: t.dmg,
      wobble: 20,
      phase: Math.random() * Math.PI * 2,
      flash: 0,
    });
    // 召唤特效
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      this.particles.push({ x: this.boss.x, y: this.boss.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: 0.35, color: '#ffb03c', size: 4 });
    }
  }

  // 进化Boss：第一阶段固定原位召唤小怪；第二阶段缓慢游走并周期性发射直线弹丸
  updateEvolved(dt) {
    const b = this.boss;
    const p = this.player;
    // —— 第一阶段：不移动、不攻击，每 1.5 秒召唤第 1 关量级的小怪 ——
    if (b.evoPhase === 1) {
      b.summonTimer -= dt;
      if (b.summonTimer <= 0) {
        b.summonTimer = EVOLVED_SUMMON_INTERVAL;
        this.spawnStage1Minion();
      }
      return;
    }
    // —— 第二阶段：保留原复活后形态的全部设定 ——
    // 远程攻击型游走：与主角保持中远距离（过近后撤、过远靠拢），始终不出现在主角身边
    const dist = Math.hypot(p.x - b.x, p.y - b.y) || 1;
    const towardX = (p.x - b.x) / dist;
    const towardY = (p.y - b.y) / dist;
    const spd = 90;
    let mvx = 0;
    let mvy = 0;
    if (dist < EVOLVED_KEEP_DISTANCE_MIN) {
      // 距离过近：反向拉开距离
      mvx = -towardX;
      mvy = -towardY;
    } else if (dist > EVOLVED_KEEP_DISTANCE_MAX) {
      // 距离过远：缓慢靠拢进入射程
      mvx = towardX;
      mvy = towardY;
    }
    b.x += mvx * spd * dt + Math.sin(b.phase * 1.1) * 30 * dt;
    b.y += mvy * spd * dt + Math.cos(b.phase * 0.8) * 24 * dt;
    b.x = Math.max(b.r, Math.min(this.W - b.r, b.x));
    b.y = Math.max(b.r, Math.min(this.H * 0.55, b.y));
    // 复活金身期间（独立计时 evolvedInvulnRemaining > 0）Boss 不受伤害且不攻击；其他时间周期性向主角发射直线弹丸：伤害 = 10 + 主角最大生命值 * 5%
    if (this.evolvedInvulnRemaining > 0) {
      this.evolvedInvulnRemaining = Math.max(0, this.evolvedInvulnRemaining - dt);
    } else {
      b.attackCd -= dt;
      if (b.attackCd <= 0) {
        b.attackCd = 2.0;
        const ang = Math.atan2(p.y - b.y, p.x - b.x);
        const dmg = Math.max(1, Math.round(EVOLVED_PROJECTILE_DMG_BASE + this.maxHp * EVOLVED_PROJECTILE_DMG_RATIO));
        this.bossProjectiles.push({
          x: b.x, y: b.y,
          vx: Math.cos(ang) * ELITE_PROJECTILE_SPEED,
          vy: Math.sin(ang) * ELITE_PROJECTILE_SPEED,
          r: ELITE_PROJECTILE_R, dmg, life: 3,
        });
      }
    }
  }

  // Boss「极限」登场（第 3 关结束后强制挑战；击败后进入第 4 关小怪关）
  spawnExtremeBoss() {
    const cfg = BOSS_EXTREME;
    this.boss = {
      name: cfg.name,
      hp: cfg.hp,
      maxHp: cfg.hp,
      x: this.W / 2,
      y: 130,
      r: 78,
      phase: 0,
      flash: 0,
      attackCd: 1,
    };
    this.bossPhase = 'extreme';
    this.extremeShotCd = EXTREME_SHOT_INTERVAL;
    this.killField = false;
    this.meteorCd = METEOR_INTERVAL;
    this.meteors = [];
    this.bossBanner = 2.4;
    this.bossBannerText = 'BOSS · 极限';
    // 第二幕：极限登场前导师警告
    this.showStory('extreme', [
      { step: 2, text: '小心！前面那个大家伙叫「极限」——它曾是我们最强的守护造物。' },
      { step: 2, text: '它已经疯了，别指望讲道理。侧身走位，看准弹幕空隙再反击！' },
    ]);
    this.bossHud.classList.remove('hidden');
    this.bossHud.querySelector('[data-k="bossName"]').textContent = cfg.name;
    this.updateBossHud();
    this.saveCheckpoint();
    this.addFloat(this.W / 2, this.H / 2 - 40, 'Boss · 极限 登场！', '#ff4a4a');
    this.updateSkipBtn();
  }

  // 跳过当前关卡：按满经验值结算直接进入下一关（Boss 关不可跳过；创作者模式可跳过包括 Boss 关在内的所有关卡）
  skipStage() {
    if (this.state !== 'playing') return;
    // 创作者模式：阶段性跳过，每次仅跳过当前一个关卡或单个 Boss 关（不再直达最终 Boss）
    if (this.creatorModeOn) {
      if (this.bossPhase === 'evolved') {
        // 进化Boss：直接通关 -> 本局结束胜利
        this.boss = null;
        this.bossPhase = 'normal';
        this.bossProjectiles = [];
        this.bossHud.classList.add('hidden');
        this.gameOver(true);
        return;
      }
      if (this.bossPhase === 'reaper') {
        // 死神：直接击败 -> 进入第 6 关进化Boss关卡
        this.spawnEvolvedBoss();
        return;
      }
      this.bossTriggered = true; // 创作者模式跳过 Boss 关时标记已触发，避免后续升级再次自动触发 Eternity
      // 当前为小怪关：直接推进到下一关（跳过关卡，不触发升级、不增加等级/经验/攻击）
      if (!this.boss) {
        this.enterNextStage();
        this.updateSkipBtn();
        return;
      }
      // 当前为单个 Boss 关：直接击败该 Boss 进入下一关
      if (this.bossPhase === 'boss') {
        // Eternity：直接击败（不触发转化、不弹出被动卡牌），直接进入第 2 关小怪关
        this.boss = null;
        this.bossPhase = 'normal';
        this.bossHud.classList.add('hidden');
        this.passiveChosen = 'break'; // 创作者模式跳过 Eternity 关时自动选择被动，避免再次弹出三选一
        this.enterNextStage();
      } else if (this.bossPhase === 'extreme') {
        // Boss「极限」：进入第 4 关小怪关
        this.boss = null;
        this.bossPhase = 'normal';
        this.killField = false;
        this.bossHud.classList.add('hidden');
        this.stage = 4;
        this.enterNextStage();
      } else if (this.bossPhase === 'pseudo') {
        // 伪·永恒：直接击败进入第 2 关小怪关（不弹出被动卡牌，被动已随 Eternity 跳过时选定）
        this.boss = null;
        this.bossPhase = 'normal';
        this.bossHud.classList.add('hidden');
        if (!this.passiveChosen) this.passiveChosen = 'break'; // 兜底：若未选过被动则自动选择
        this.enterNextStage();
      } else {
        // 死神：直接通关 -> 本局结束胜利
        this.boss = null;
        this.bossPhase = 'normal';
        this.bgReaperAlpha = 0;
        this.reaperBlackhole = null;
        this.reaperBeams = [];
        this.curseTimer = 0;
        this.stunTimer = 0;
        this.bossHud.classList.add('hidden');
        this.gameOver(true);
        return;
      }
      this.updateSkipBtn();
      return;
    }
    if (this.boss) return; // Boss 关不可跳过
    // 直接推进到下一关（跳过关卡，不触发升级、不增加等级/经验/攻击）
    this.enterNextStage();
  }

  updateSkipBtn() {
    // Boss 关不可跳过；其余小怪关（含第 1 关）可跳过；创作者模式可跳过所有关卡（含 Boss 关）
    const bossLocked = !!this.boss && !this.creatorModeOn;
    const disabled = bossLocked || this.state !== 'playing';
    this.skipBtn.classList.toggle('disabled', disabled);
    if (this.creatorModeOn) {
      this.skipBtn.textContent = '创作者 · 跳过本关';
    } else if (this.boss) {
      this.skipBtn.textContent = 'Boss 战';
    } else {
      this.skipBtn.textContent = `跳过 · 第${this.stage}关`;
    }
  }

  updateBoss(dt) {
    const b = this.boss;
    b.phase += dt;
    b.flash -= dt;

    // Eternity：全屏能量波（预警 -> 命中）；伪·永恒蓄力光波
    if (this.bossPhase === 'boss') {
      // 左右缓慢摆动
      const amp = 60;
      b.x = this.W / 2 + Math.sin(b.phase * 0.8) * amp;
      b.x = Math.max(b.r, Math.min(this.W - b.r, b.x));
      const targetY = 120;
      b.y += (targetY - b.y) * Math.min(1, dt * 1.5);
      this.updateEternityWave(dt);
    } else if (this.bossPhase === 'extreme') {
      this.updateExtreme(dt);
    } else if (this.bossPhase === 'reaper') {
      this.updateReaper(dt);
    } else if (this.bossPhase === 'evolved') {
      this.updateEvolved(dt);
      this.updateBossProjectiles(dt);
    } else {
      this.updatePseudo(dt);
    }
  }

  // 进化Boss 弹丸：向主角方向直线飞行，命中扣血并销毁，飞出屏幕即移除
  updateBossProjectiles(dt) {
    const p = this.player;
    for (let i = this.bossProjectiles.length - 1; i >= 0; i--) {
      const pr = this.bossProjectiles[i];
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      pr.life -= dt;
      // 飞出屏幕或超时移除
      if (pr.life <= 0 || pr.x < -40 || pr.x > this.W + 40 || pr.y < -40 || pr.y > this.H + 40) {
        this.bossProjectiles.splice(i, 1);
        continue;
      }
      // 命中主角判定
      if (Math.hypot(pr.x - p.x, pr.y - p.y) < pr.r + p.w / 2) {
        this.bossProjectiles.splice(i, 1);
        if (!this.isInvincible()) {
          const newHp = this.hp - pr.dmg;
          if (newHp <= 0 && this.bossPhase === 'evolved' && !this.slowFieldBlockUsed) {
            // 缓行领域中若血量应清零则触发一次格挡，格挡当前伤害保留 1 点血量
            this.slowFieldBlockUsed = true;
            this.hp = 1;
            this.shake = 8;
            this.addFloat(p.x, p.y - 70, '格挡！', '#ffd24a');
            this.addFloat(p.x, p.y - 50, `-${pr.dmg} HP`, '#ff5a5a');
            for (let k = 0; k < 6; k++) {
              const a = Math.random() * Math.PI * 2;
              this.particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.3, color: '#ffd24a', size: 4 });
            }
          } else {
            this.hp = newHp;
            this.shake = 10;
            this.addFloat(p.x, p.y - 50, `-${pr.dmg} HP`, '#ff5a5a');
            for (let k = 0; k < 6; k++) {
              const a = Math.random() * Math.PI * 2;
              this.particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.3, color: '#ff9a5a', size: 4 });
            }
            if (this.hp <= 0) { this.hp = 0; this.gameOver(false); return; }
          }
        } else {
          this.addFloat(p.x, p.y - 50, '免疫', '#ffd24a');
        }
      }
    }
  }

  // 伪最终 Boss「死神」：缓慢游走 + 三种攻击（闪现横劈 / 裂缝诅咒 / 黑洞）
  updateReaper(dt) {
    const b = this.boss;
    const p = this.player;
    // 背景随出场逐渐显现
    if (this.bgReaperAlpha < 1) this.bgReaperAlpha = Math.min(1, this.bgReaperAlpha + dt * 0.6);
    // 缓慢向主角位置靠拢并带轻微游走，保持在上半区（定身预警期间不移动）
    if (this.reaperSlashWarn <= 0) {
      const dx = p.x - b.x;
      const dy = (p.y - 200) - b.y;
      const len = Math.hypot(dx, dy) || 1;
      const spd = 120;
      b.x += (dx / len) * spd * dt + Math.sin(b.phase * 1.1) * 30 * dt;
      b.y += (dy / len) * spd * dt + Math.cos(b.phase * 0.8) * 24 * dt;
      b.x = Math.max(b.r, Math.min(this.W - b.r, b.x));
      b.y = Math.max(b.r, Math.min(this.H * 0.5, b.y));
    }

    // 攻击 1：闪现扇形斩击（普通攻击，高频）——先闪现到主角正前方，定身1秒预警，再释放扇形斩击
    if (this.reaperSlashWarn > 0) {
      // 定身预警阶段：Boss 保持不动，倒计时结束释放扇形斩击
      this.reaperSlashWarn -= dt;
      if (this.reaperSlashWarn <= 0) {
        this.reaperSlashWarn = 0;
        this.doReaperSlash();
        this.reaperSlashCd = REAPER_SLASH_INTERVAL;
      }
    } else {
      this.reaperSlashCd -= dt;
      if (this.reaperSlashCd <= 0 && this.reaperRiftCharge <= 0) {
        // 立即闪现到主角正前方，然后进入定身预警
        const b2 = this.boss;
        const tx = p.x;
        const ty = Math.max(b2.r, p.y - 140);
        for (let i = 0; i < 14; i++) {
          const a = (i / 14) * Math.PI * 2;
          this.particles.push({ x: b2.x, y: b2.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, life: 0.35, color: '#ff9ae6', size: 4 });
        }
        b2.x = Math.max(b2.r, Math.min(this.W - b2.r, tx));
        b2.y = ty;
        this.reaperSlashWarn = REAPER_SLASH_WARN; // 定身 1 秒
        this.addFloat(p.x, p.y - 80, '⚠ 死神定身 · 扇形斩击！', '#ff9ae6');
      }
    }

    // 攻击 2：裂缝诅咒（特殊攻击，触发概率远低于普通攻击）——蓄力 3s 后正前与左右斜方劈出裂缝
    if (this.reaperRiftCharge > 0) {
      this.reaperRiftCharge -= dt;
      if (this.reaperRiftCharge <= 0) {
        this.reaperRiftCharge = 0;
        this.fireReaperRift();
        this.reaperRiftCd = REAPER_RIFT_INTERVAL;
      }
    } else {
      this.reaperRiftCd -= dt;
      if (this.reaperRiftCd <= 0) {
        this.reaperRiftCd = REAPER_RIFT_INTERVAL;
        // 特殊攻击触发概率远低于普通攻击
        if (Math.random() < REAPER_RIFT_PROB) {
          this.reaperRiftCharge = REAPER_RIFT_CHARGE;
          this.addFloat(this.W / 2, this.H / 2 - 60, '⚠ 死神蓄力 · 裂缝来袭！', '#b58cff');
        }
      }
    }

    // 攻击 3：黑洞（中频）——吸入则定身 2s，未吸入则射出八道光线
    this.reaperBlackholeCd -= dt;
    if (this.reaperBlackholeCd <= 0 && !this.reaperBlackhole) {
      this.reaperBlackholeCd = REAPER_BLACKHOLE_INTERVAL;
      this.spawnReaperBlackhole();
    }
    this.updateReaperBlackhole(dt);
    this.updateReaperBeams(dt);
  }

  // 死神扇形斩击：定身预警结束后向前方释放扇形范围斩击，命中扇形内的主角造成最大生命值 10%
  doReaperSlash() {
    const b = this.boss;
    const p = this.player;
    // 扇形判定：以 Boss 为圆心，正下方为中心方向，半角 ±REAPER_SLASH_HALF_ANGLE，半径 REAPER_SLASH_RANGE
    const dx = p.x - b.x;
    const dy = p.y - b.y;
    const dist = Math.hypot(dx, dy);
    const maxR = REAPER_SLASH_RANGE + p.w / 2;
    if (dist <= maxR) {
      // 中心方向为正下方 (Math.PI/2)
      const angleToPlayer = Math.atan2(dy, dx);
      const centerAngle = Math.PI / 2;
      let diff = angleToPlayer - centerAngle;
      // 归一化到 [-PI, PI]
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) <= REAPER_SLASH_HALF_ANGLE) {
        const dmg = Math.max(1, Math.round(this.maxHp * REAPER_SLASH_DMG_RATIO));
        if (!this.isInvincible()) {
          this.hp -= dmg;
          this.shake = 16;
          this.addFloat(p.x, p.y - 50, `-${dmg} HP`, '#ff5a5a');
          if (this.hp <= 0) { this.hp = 0; this.gameOver(false); return; }
        } else {
          this.addFloat(p.x, p.y - 50, '免疫', '#ffd24a');
        }
      }
    }
    // 扇形视觉：多道弧光粒子模拟扇形斩击
    for (let i = 0; i < 8; i++) {
      const a = Math.PI / 2 + (i / 7 - 0.5) * REAPER_SLASH_HALF_ANGLE * 2;
      this.particles.push({
        x: b.x + Math.cos(a) * 30,
        y: b.y + Math.sin(a) * 30,
        vx: Math.cos(a) * 300,
        vy: Math.sin(a) * 300,
        life: 0.3, color: '#fff', size: 8, slash: true,
      });
    }
  }

  // 死神裂缝：蓄力结束后向正前方与左右斜方劈出三道裂缝，瞬间命中扣 10 血并附加诅咒
  fireReaperRift() {
    const b = this.boss;
    const p = this.player;
    // 三个方向：正前方(向下)、左斜、右斜
    const dirs = [Math.PI / 2, Math.PI / 2 - 0.6, Math.PI / 2 + 0.6];
    for (const ang of dirs) {
      this.reaperBeams.push({
        x: b.x, y: b.y,
        vx: Math.cos(ang) * 520,
        vy: Math.sin(ang) * 520,
        r: 18, dmg: REAPER_RIFT_DMG, life: 1.2, fromBoss: true,
        rift: true, curse: true,
      });
    }
    // 裂缝爆发粒子
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      this.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 0.45, color: '#b58cff', size: 5 });
    }
    void p;
  }

  // 死神黑洞：在主角上方出现并向远离主角方向缓慢漂移（不强行吸入），可移动躲避；
  // 若仍被击中则短暂定身并立即弹出结束，否则到期射出八道光线
  spawnReaperBlackhole() {
    const p = this.player;
    const bx = p.x + (Math.random() - 0.5) * 160;
    const by = p.y - 220;
    this.reaperBlackhole = { x: bx, y: by, life: REAPER_BLACKHOLE_LIFE, pulled: false };
    this.addFloat(bx, by - REAPER_BLACKHOLE_RADIUS - 10, '⚠ 黑洞来袭 · 快躲开！', '#7a4aff');
  }

  updateReaperBlackhole(dt) {
    const bh = this.reaperBlackhole;
    if (!bh) return;
    bh.life -= dt;
    const p = this.player;
    // 漂移：黑洞向远离主角的方向缓慢移动，给玩家留出躲避空间（不再把主角强行吸过去）
    const dx = p.x - bh.x;
    const dy = p.y - bh.y;
    const dist = Math.hypot(dx, dy) || 1;
    bh.x += (dx / dist) * REAPER_BLACKHOLE_DRIFT * dt;
    bh.y += (dy / dist) * REAPER_BLACKHOLE_DRIFT * dt;
    // 命中判定：主角进入黑洞半径内 -> 短暂定身并立即弹出结束
    if (!bh.pulled && dist < REAPER_BLACKHOLE_RADIUS + p.w / 2) {
      bh.pulled = true;
      this.stunTimer = REAPER_BLACKHOLE_STUN;
      this.addFloat(p.x, p.y - 60, '被击中 · 短暂定身！', '#7a4aff');
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        this.particles.push({ x: bh.x, y: bh.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, life: 0.4, color: '#7a4aff', size: 4 });
      }
      this.reaperBlackhole = null;
      return;
    }
    // 存活结束且未吸入 -> 射出八道光线
    if (bh.life <= 0) {
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        this.reaperBeams.push({
          x: bh.x, y: bh.y,
          vx: Math.cos(ang) * 380,
          vy: Math.sin(ang) * 380,
          r: 12,
          dmg: Math.max(1, Math.round(this.maxHp * REAPER_BLACKHOLE_BEAM_DMG_RATIO)),
          life: 1.6, fromBoss: true, beam: true,
        });
      }
      this.addFloat(bh.x, bh.y, '光线爆发！', '#9a6aff');
      this.reaperBlackhole = null;
    }
  }

  updateReaperBeams(dt) {
    const p = this.player;
    for (let i = this.reaperBeams.length - 1; i >= 0; i--) {
      const bm = this.reaperBeams[i];
      bm.x += bm.vx * dt;
      bm.y += bm.vy * dt;
      bm.life -= dt;
      const dx = bm.x - p.x;
      const dy = bm.y - p.y;
      const hitR = bm.r + p.w / 2;
      if (dx * dx + dy * dy < hitR * hitR) {
        if (!this.isInvincible()) {
          this.hp -= bm.dmg;
          this.shake = 10;
          this.addFloat(p.x, p.y - 50, `-${bm.dmg} HP`, '#ff5a5a');
          // 裂缝命中附加诅咒：每秒扣 5% 最大生命值，持续 2s
          if (bm.curse) {
            this.curseTimer = REAPER_CURSE_DURATION;
            this.curseTick = 1; // 立即开始每 1s 扣血
            this.addFloat(p.x, p.y - 70, '受诅咒！', '#b58cff');
          }
          if (this.hp <= 0) { this.hp = 0; this.gameOver(false); return; }
        } else {
          this.addFloat(p.x, p.y - 50, '免疫', '#ffd24a');
        }
        this.reaperBeams.splice(i, 1);
        continue;
      }
      if (bm.life <= 0 || bm.x < -40 || bm.x > this.W + 40 || bm.y < -40 || bm.y > this.H + 40) {
        this.reaperBeams.splice(i, 1);
      }
    }
  }

  // 诅咒结算：每秒扣主角最大生命值 5%，持续 2s
  updateCurse(dt) {
    if (this.curseTimer <= 0) return;
    this.curseTimer = Math.max(0, this.curseTimer - dt);
    this.curseTick -= dt;
    if (this.curseTick <= 0) {
      this.curseTick = 1;
      if (this.curseTimer > 0) {
        const dmg = Math.max(1, Math.round(this.maxHp * REAPER_CURSE_DPS_RATIO));
        if (!this.isInvincible()) {
          this.hp -= dmg;
          this.addFloat(this.player.x, this.player.y - 60, `诅咒 -${dmg}`, '#b58cff');
          if (this.hp <= 0) { this.hp = 0; this.gameOver(false); return; }
        }
      }
    }
  }

  // 最终 Boss「极限」：灵活上下左右移动，朝主角方向扔陨石（预先标出落点位置与范围）；半血启动杀戮领域（期间伤害翻倍）
  updateExtreme(dt) {
    const b = this.boss;
    // 灵活上下左右移动：缓慢向主角位置靠拢并带轻微游走，保持在上半区
    const p = this.player;
    const dx = p.x - b.x;
    const dy = (p.y - 160) - b.y; // 目标 y 略高于主角，避免贴脸
    const len = Math.hypot(dx, dy) || 1;
    b.x += (dx / len) * EXTREME_MOVE_SPEED * dt + Math.sin(b.phase * 1.2) * 40 * dt;
    b.y += (dy / len) * EXTREME_MOVE_SPEED * dt + Math.cos(b.phase * 0.9) * 30 * dt;
    b.x = Math.max(b.r, Math.min(this.W - b.r, b.x));
    b.y = Math.max(b.r, Math.min(this.H * 0.55, b.y));
    // 半血时启动杀戮领域（一次性触发）：期间 Boss 伤害翻倍
    if (!this.killField && b.hp <= b.maxHp * 0.5) {
      this.killField = true;
      this.addFloat(this.W / 2, this.H / 2 - 60, '⚠ 杀戮领域 · 技能封印 · 伤害翻倍！', '#ff4a4a');
      for (let i = 0; i < 30; i++) {
        const a = (i / 30) * Math.PI * 2;
        this.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, life: 0.6, color: '#ff4a4a', size: 5 });
      }
    }
    // 持续朝主角方向扔陨石（预先标出落点位置与范围）
    this.meteorCd -= dt;
    if (this.meteorCd <= 0) {
      this.meteorCd = METEOR_INTERVAL;
      this.throwMeteor();
    }
    this.updateMeteors(dt);
  }

  // 「极限」朝主角所在方向扔一颗陨石：先预标落点位置与范围，预警结束后砸下造成伤害
  throwMeteor() {
    const p = this.player;
    const tx = p.x + (Math.random() - 0.5) * 40;
    const ty = p.y + (Math.random() - 0.5) * 40;
    this.meteors.push({ x: tx, y: ty, r: METEOR_RADIUS, warn: METEOR_WARNING });
    this.addFloat(tx, ty - METEOR_RADIUS - 10, '⚠ 陨石来袭！', '#ff8a3c');
  }

  // 陨石落点预警计时：预警结束 -> 在标出的位置与范围内砸下结算伤害
  updateMeteors(dt) {
    const p = this.player;
    for (let i = this.meteors.length - 1; i >= 0; i--) {
      const m = this.meteors[i];
      m.warn -= dt;
      if (m.warn <= 0) {
        // 砸下：落点范围内命中玩家造成 8 点伤害（杀戮领域开启时翻倍为 16）
        const dmg = this.killField ? METEOR_DMG * 2 : METEOR_DMG;
        const dx = m.x - p.x;
        const dy = m.y - p.y;
        if (dx * dx + dy * dy < (m.r + p.w / 2) * (m.r + p.w / 2)) {
          if (!this.isInvincible()) {
            this.hp -= dmg;
            this.shake = 18;
            this.addFloat(p.x, p.y - 50, `-${dmg} HP`, '#ff5a5a');
            if (this.hp <= 0) {
              this.hp = 0;
              this.gameOver(false);
              return;
            }
          } else {
            this.addFloat(p.x, p.y - 50, '免疫', '#ffd24a');
          }
        }
        // 落地爆裂粒子（覆盖整个落点范围）
        for (let k = 0; k < 22; k++) {
          const a = (k / 22) * Math.PI * 2;
          const rr = Math.random() * m.r;
          this.particles.push({
            x: m.x + Math.cos(a) * rr, y: m.y + Math.sin(a) * rr,
            vx: Math.cos(a) * 160, vy: Math.sin(a) * 160 - 60,
            life: 0.5, color: '#ff8a3c', size: 4,
          });
        }
        this.meteors.splice(i, 1);
      }
    }
  }

  // 「极限」朝主角方向扔出陨石（预先标出落点位置与范围，砸到一下 8 点伤害；杀戮领域开启时翻倍为 16）
  // （原炮弹逻辑已由陨石取代，保留函数名以兼容旧调用）
  fireExtremeShot() {
    this.throwMeteor();
  }

  // 伪·永恒：非蓄力时四处移动，攻击前静止蓄力 2 秒，随后发射光波，间隔 5 秒
  updatePseudo(dt) {
    const b = this.boss;
    if (this.pseudoCharge > 0) {
      // 蓄力期间保持不动
      this.pseudoCharge -= dt;
      if (this.pseudoCharge <= 0) {
        this.pseudoCharge = 0;
        this.firePseudoBeam();
        this.pseudoCd = PSEUDO_INTERVAL; // 从发射时刻起计时下一次攻击
      }
    } else {
      // 四处移动（左右摆动 + 上下浮动，比 Eternity 更快更贴近）
      const amp = 90;
      b.x = this.W / 2 + Math.sin(b.phase * 0.9) * amp;
      b.x = Math.max(b.r, Math.min(this.W - b.r, b.x));
      const targetY = 150 + Math.sin(b.phase * 1.4) * 30;
      b.y += (targetY - b.y) * Math.min(1, dt * 1.8);
      // 攻击倒计时
      this.pseudoCd -= dt;
      if (this.pseudoCd <= 0) {
        this.pseudoCd = PSEUDO_INTERVAL;
        this.pseudoCharge = PSEUDO_CHARGE; // 进入蓄力
        this.addFloat(this.W / 2, this.H / 2 - 60, '⚠ 光波蓄力！', '#7ee6ff');
      }
    }
  }

  // 伪·永恒向下发射一道光波（命中造成伤害）
  firePseudoBeam() {
    const b = this.boss;
    const sp = 380;
    this.bullets.push({
      x: b.x, y: b.y + b.r * 0.5,
      vx: 0,
      vy: sp,
      r: 16,
      dmg: PSEUDO_BEAM_DMG,
      life: 4,
      fromBoss: true,
      beam: true,
      down: true,
    });
    // 发射瞬间的爆发粒子
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      this.particles.push({
        x: b.x, y: b.y,
        vx: Math.cos(a) * 220, vy: Math.sin(a) * 220,
        life: 0.4, color: '#7ee6ff', size: 4,
      });
    }
  }

  // Eternity 全屏能量波：先蓄力预警，再对全屏玩家造成固定伤害
  updateEternityWave(dt) {
    if (this.waveWarning > 0) {
      // 预警阶段结束 -> 释放能量波并结算伤害
      this.waveWarning -= dt;
      if (this.waveWarning <= 0) {
        this.waveWarning = 0;
        if (!this.waveHit) {
          this.waveHit = true;
          if (this.isInvincible()) {
            this.addFloat(this.player.x, this.player.y - 50, '免疫', '#ffd24a');
            this.waveTimer = WAVE_INTERVAL;
            return;
          }
          this.hp -= WAVE_DAMAGE;
          this.shake = 16;
          this.addFloat(this.player.x, this.player.y - 50, `-${WAVE_DAMAGE} HP`, '#ff5a5a');
          // 冲击波粒子
          for (let i = 0; i < 24; i++) {
            const a = (i / 24) * Math.PI * 2;
            this.particles.push({
              x: this.W / 2, y: this.H / 2,
              vx: Math.cos(a) * 420, vy: Math.sin(a) * 420,
              life: 0.5, color: '#ff5ad0', size: 5,
            });
          }
          if (this.hp <= 0) {
            // 被 Eternity 能量波打死 -> 立即满血重生，Boss 转化为伪·永恒
            this.hp = this.maxHp;
            this.addFloat(this.player.x, this.player.y - 70, '重生！', '#6ee7ff');
            for (let i = 0; i < 16; i++) {
              const a = (i / 16) * Math.PI * 2;
              this.particles.push({
                x: this.player.x, y: this.player.y,
                vx: Math.cos(a) * 180, vy: Math.sin(a) * 180,
                life: 0.5, color: '#6ee7ff', size: 4,
              });
            }
            this.transformToPseudo();
          }
        }
        this.waveTimer = WAVE_INTERVAL;
      }
    } else {
      // 蓄力倒计时
      this.waveTimer -= dt;
      if (this.waveTimer <= 0) {
        this.waveTimer = WAVE_INTERVAL;
        this.waveWarning = WAVE_WARNING;
        this.waveHit = false;
        this.addFloat(this.W / 2, this.H / 2 - 60, '⚠ 全屏能量波！', '#ff9ae6');
      }
    }
  }

  bossFire() {
    const b = this.boss;
    const p = this.player;
    const dx = p.x - b.x;
    const dy = p.y - b.y;
    const len = Math.hypot(dx, dy) || 1;
    const sp = 300;
    this.bullets.push({
      x: b.x, y: b.y + b.r * 0.5,
      vx: (dx / len) * sp,
      vy: (dy / len) * sp,
      r: 12,
      dmg: 2,
      life: 4,
      fromBoss: true,
    });
  }

  updateBossHud() {
    const fill = this.bossHud.querySelector('.boss-fill');
    if (fill && this.boss) fill.style.width = `${Math.max(0, (this.boss.hp / this.boss.maxHp) * 100)}%`;
  }

  // 第 2、3 关击杀进度 HUD：显示本关 x/500
  updateStageProgressHud() {
    const goal = STAGE_KILL_GOAL[this.stage];
    if (!goal || this.boss || this.state !== 'playing') {
      this.stageProgress.classList.add('hidden');
      return;
    }
    this.stageProgress.classList.remove('hidden');
    this.stageProgress.querySelector('[data-k="stageNum"]').textContent = String(this.stage);
    this.stageProgress.querySelector('[data-k="stageKills"]').textContent = String(Math.min(this.stageKills, goal));
    this.stageProgress.querySelector('[data-k="stageGoal"]').textContent = String(goal);
  }

  // ---------- 魔法导师剧情（半互动式：点击推进，关键节点可选祝福） ----------
  showStory(key, steps, onDone) {
    if (this.storySceneDone[key]) { if (onDone) onDone(); return; } // 同一场景只播一次
    this.storySceneDone[key] = true;
    this.storyQueue = steps.slice();
    this.storyOnDone = onDone || null;
    this.storyPending = true;
    this.renderStoryStep();
    this.storyScreen.classList.remove('hidden');
  }

  renderStoryStep() {
    const s = this.storyQueue[0];
    if (!s) return;
    this.storyStepEl.textContent = s.step ? `第 ${s.step} 幕` : '剧情';
    this.storyTextEl.textContent = s.text;
    const hasChoices = !!s.choices;
    this.storyChoicesEl.classList.toggle('hidden', !hasChoices);
    this.storyHintEl.style.visibility = hasChoices ? 'hidden' : 'visible';
  }

  advanceStory() {
    if (!this.storyPending) return;
    const s = this.storyQueue[0];
    if (s && s.choices) return; // 出现选项时必须点击选项，点击空白不推进
    this.storyQueue.shift();
    if (this.storyQueue.length === 0) this.endStory();
    else this.renderStoryStep();
  }

  chooseBlessing(key) {
    if (!this.storyPending) return;
    const s = this.storyQueue[0];
    if (!s || !s.choices) return;
    this.blessingChosen = key;
    if (key === 'power') {
      this.damage += 2; // 力量祝福：攻击力永久 +2
    } else {
      this.maxHp += 2; // 生命祝福：生命上限永久 +2 并回满
      this.hp = this.maxHp;
    }
    this.updateHud();
    this.addFloat(this.W / 2, this.H / 2 - 60, key === 'power' ? '获得 力量祝福！' : '获得 生命祝福！', '#ffd87a');
    this.storyQueue.shift();
    if (this.storyQueue.length === 0) this.endStory();
    else this.renderStoryStep();
  }

  endStory() {
    this.storyPending = false;
    this.storyQueue = [];
    this.storyScreen.classList.add('hidden');
    const cb = this.storyOnDone;
    this.storyOnDone = null;
    if (cb) cb();
    if (this.state === 'playing') {
      this.lastT = performance.now();
      cancelAnimationFrame(this.raf);
      this.raf = requestAnimationFrame(this.loop);
    }
  }

  showPassiveSelect() {
    this.passivePending = true;
    this.passiveScreen.classList.remove('hidden');
  }

  selectPassive(key) {
    if (!this.passivePending) return;
    this.passiveChosen = key;
    this.passivePending = false;
    this.passiveScreen.classList.add('hidden');
    // 选择后进入第 2 关（保留玩家成长与分数）
    this.enterNextStage();
    this.lastT = performance.now();
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(this.loop);
  }

  // ---------- 副武器三选一 ----------
  showWeaponSelect() {
    this.weaponPending = true;
    this.weaponScreen.classList.remove('hidden');
  }

  selectWeapon(key) {
    if (!this.weaponPending) return;
    this.weaponChosen = key;
    this.weaponPending = false;
    this.weaponScreen.classList.add('hidden');
    this.weaponPanel.classList.remove('hidden');
    this.updateWeaponPanel();
    const w = SECONDARY_WEAPONS[key];
    this.addFloat(this.W / 2, this.H / 2 - 40, `获得副武器 · ${w.name}`, '#ffd24a');
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      this.particles.push({ x: this.W / 2, y: this.H / 2, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, life: 0.5, color: w.color, size: 5 });
    }
    this.lastT = performance.now();
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(this.loop);
  }

  updateWeaponPanel() {
    if (!this.weaponPanel) return;
    const set = (k, v) => {
      const el = this.weaponPanel.querySelector(`[data-k="${k}"]`);
      if (el) el.textContent = v;
    };
    set('mainDmg', String(this.damage));
    set('mainRate', `${(1 / this.fireInterval).toFixed(1)}/s`);
    if (this.weaponChosen) {
      const w = SECONDARY_WEAPONS[this.weaponChosen];
      const dmg = Math.max(1, Math.round(this.damage * SECONDARY_DMG_RATIO));
      set('wName', `${w.name}`);
      set('wDmg', String(dmg));
      set('wRate', `${(1 / w.interval).toFixed(1)}/s`);
    } else {
      set('wName', '未选择');
      set('wDmg', '—');
      set('wRate', '—');
    }
  }

  fireSecondaryBullet() {
    if (!this.weaponChosen) return;
    const p = this.player;
    const w = SECONDARY_WEAPONS[this.weaponChosen];
    const dmg = Math.max(1, Math.round(this.damage * SECONDARY_DMG_RATIO));
    const slow = this.slowFieldActive > 0 ? this.slowFactor : 1;
    this.bullets.push({
      x: p.x + p.w * 0.28,
      y: p.y - p.h / 2,
      vy: w.speed * slow,
      r: w.r,
      dmg,
      life: 2,
      secondary: true,
      color: w.color,
    });
  }

  // ---------- 被动卡牌效果更新 ----------
  updatePassives(dt) {
    const p = this.player;
    // 破釜沉舟：血量低于 10% 且屏幕小怪 ≥10 时直接清屏，每关限一次
    if (this.passiveChosen === 'break' && !this.breakUsedThisStage && !this.boss) {
      if (this.hp > 0 && this.hp / this.maxHp < 0.1 && this.monsters.length >= 10) {
        this.breakUsedThisStage = true;
        for (let i = this.monsters.length - 1; i >= 0; i--) {
          const m = this.monsters[i];
          this.kills += 1;
          this.score += m.exp * 10;
          this.gainExp(m.exp);
          for (let k = 0; k < 8; k++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 80 + Math.random() * 200;
            this.particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4, color: '#ff8a3c', size: 4 });
          }
        }
        this.monsters = [];
        this.shake = 14;
        this.addFloat(p.x, p.y - 70, '破釜沉舟 · 清屏！', '#ff5a3c');
      }
    }
    // 控制领域：血量低于 50% 时自动开启，屏幕内小怪移速降低 20%，持续 20s
    if (this.passiveChosen === 'control' && !this.boss) {
      if (this.controlActive <= 0 && this.hp > 0 && this.hp / this.maxHp < 0.5) {
        this.controlActive = 20;
        this.addFloat(p.x, p.y - 70, '控制领域开启！小怪减速 20%', '#7ee6ff');
      }
      if (this.controlActive > 0) {
        this.speedMul *= 0.8;
        this.controlActive = Math.max(0, this.controlActive - dt);
      }
    }
    // 弹簧陷阱：屏幕内有 20 只怪时自动在底端生成弹簧，怪兽碰到反弹到顶端，持续 15s
    if (this.passiveChosen === 'spring' && !this.boss) {
      if (this.springActive <= 0 && this.monsters.length >= 20) {
        this.springActive = 15;
        this.addFloat(p.x, p.y - 70, '弹簧陷阱生成！', '#ffd24a');
      }
      // 弹簧激活期间：怪兽碰到底端弹簧 -> 反弹到最顶端（在怪物移动/触底结算前执行）
      if (this.springActive > 0) {
        this.springActive = Math.max(0, this.springActive - dt);
        for (const m of this.monsters) {
          if (m.y + m.r >= this.H - 60) {
            m.y = -m.r;
            for (let k = 0; k < 6; k++) {
              const a = Math.random() * Math.PI * 2;
              const sp = 60 + Math.random() * 140;
              this.particles.push({ x: m.x, y: this.H - 50, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0.35, color: '#ffd24a', size: 3 });
            }
          }
        }
      }
    }
  }

  // ---------- 技能体系 ----------
  useSkill(key) {
    if (this.state !== 'playing') return;
    // 杀戮领域（最终 Boss 半血启动）期间主角不可使用任何技能
    if (this.killField) {
      this.addFloat(this.player.x, this.player.y - 60, '技能被封印！', '#ff4a4a');
      this.updateSkillBar();
      return;
    }
    if (key === 'defense' && this.skillDefenseCd <= 0) {
      this.skillDefenseActive = SKILL_DEFENSE_DURATION;
      this.skillDefenseCd = SKILL_DEFENSE_CD;
      this.addFloat(this.player.x, this.player.y - 60, '绝对防御 · 金身！', '#ffd24a');
      for (let i = 0; i < 20; i++) {
        const a = (i / 20) * Math.PI * 2;
        this.particles.push({ x: this.player.x, y: this.player.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, life: 0.5, color: '#ffe27a', size: 4 });
      }
    } else if (key === 'charge' && this.skillChargeCd <= 0) {
      this.skillChargeActive = SKILL_CHARGE_DURATION;
      this.skillChargeCd = SKILL_CHARGE_CD;
      this.addFloat(this.player.x, this.player.y - 60, '充能攻击 · 伤害+150%！', '#ff9a3c');
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        this.particles.push({ x: this.player.x, y: this.player.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.45, color: '#ffb03c', size: 4 });
      }
    } else if (key === 'ult' && this.skillUltCd <= 0) {
      this.skillUltActive = SKILL_ULT_DURATION;
      this.skillUltCd = SKILL_ULT_CD;
      this.ultFireTimer = 0;
      this.addFloat(this.player.x, this.player.y - 60, '大招 · 双列弹幕！', '#6ee7ff');
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        this.particles.push({ x: this.player.x, y: this.player.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, life: 0.5, color: '#6ee7ff', size: 5 });
      }
    }
    this.updateSkillBar();
  }

  updateSkillBar() {
    const items = [
      { btn: this.skillBtns.defense, cd: this.skillDefenseCd, active: this.skillDefenseActive },
      { btn: this.skillBtns.charge, cd: this.skillChargeCd, active: this.skillChargeActive },
      { btn: this.skillBtns.ult, cd: this.skillUltCd, active: this.skillUltActive },
    ];
    for (const it of items) {
      if (!it.btn) continue;
      const cdEl = it.btn.querySelector('.skill-cd');
      it.btn.classList.toggle('active', it.active > 0);
      it.btn.classList.toggle('cooling', it.cd > 0);
      if (it.cd > 0) {
        cdEl.textContent = Math.ceil(it.cd);
        cdEl.style.display = 'flex';
      } else {
        cdEl.style.display = 'none';
      }
    }
  }

  // 技能激活时长与冷却逐帧衰减
  updateSkills(dt) {
    let changed = false;
    if (this.skillDefenseActive > 0) { this.skillDefenseActive = Math.max(0, this.skillDefenseActive - dt); changed = true; }
    if (this.skillDefenseCd > 0) { this.skillDefenseCd = Math.max(0, this.skillDefenseCd - dt); changed = true; }
    if (this.skillChargeActive > 0) { this.skillChargeActive = Math.max(0, this.skillChargeActive - dt); changed = true; }
    if (this.skillChargeCd > 0) { this.skillChargeCd = Math.max(0, this.skillChargeCd - dt); changed = true; }
    if (this.skillUltActive > 0) { this.skillUltActive = Math.max(0, this.skillUltActive - dt); changed = true; }
    if (this.skillUltCd > 0) { this.skillUltCd = Math.max(0, this.skillUltCd - dt); changed = true; }
    if (changed) this.updateSkillBar();
  }

  // 金身期间不受任何伤害
  isInvincible() { return this.skillDefenseActive > 0; }

  // 缓行领域：主角移动和射击速度逐渐变慢，持续 10s；若血量应清零则触发一次格挡保留 1 HP
  updateSlowField(dt) {
    if (this.slowFieldActive <= 0) return;
    this.slowFieldActive = Math.max(0, this.slowFieldActive - dt);
    this.slowFieldElapsed += dt;
    // 随时间逐渐变慢：从 1.0 衰减到 0.45
    const t = Math.min(1, this.slowFieldElapsed / EVOLVED_SLOW_DURATION);
    this.slowFactor = 1 - t * 0.55;
  }

  // ---------- 更新 ----------
  update(dt) {
    this.time += dt;
    const p = this.player;
    this.updateSkills(dt);
    // 诅咒结算（死神裂缝命中附加）
    this.updateCurse(dt);
    // 缓行领域（进化Boss 复活后释放）
    this.updateSlowField(dt);

    // 移动：键盘 + 触控目标位置（Boss「极限」关支持上下左右，其余关卡仅左右）
    const baseSpeed = 380;
    const speed = baseSpeed * (this.slowFieldActive > 0 ? this.slowFactor : 1);
    let dir = 0;
    let vdir = 0;
    if (this.keys.has('ArrowLeft') || this.keys.has('a') || this.keys.has('A')) dir -= 1;
    if (this.keys.has('ArrowRight') || this.keys.has('d') || this.keys.has('D')) dir += 1;
    if (this.bossPhase === 'extreme' || this.bossPhase === 'reaper') {
      if (this.keys.has('ArrowUp') || this.keys.has('w') || this.keys.has('W')) vdir -= 1;
      if (this.keys.has('ArrowDown') || this.keys.has('s') || this.keys.has('S')) vdir += 1;
    }
    // 被黑洞吸入定身期间无法移动
    if (this.stunTimer > 0) {
      this.stunTimer = Math.max(0, this.stunTimer - dt);
    } else {
      p.x += dir * speed * dt;
      p.y += vdir * speed * dt;
    }
    // 触控移动：定身期间同样无法移动主角
    if (this.stunTimer <= 0) {
      if (this.touchX !== null) {
        const target = this.touchX;
        const dx = target - p.x;
        const step = Math.sign(dx) * Math.min(Math.abs(dx), speed * dt);
        p.x += step;
      }
      if ((this.bossPhase === 'extreme' || this.bossPhase === 'reaper') && this.touchY !== null) {
        // Boss「极限」/「死神」关：触控上下移动主角
        const dy = this.touchY - p.y;
        const stepY = Math.sign(dy) * Math.min(Math.abs(dy), speed * dt);
        p.y += stepY;
      }
    }
    const half = p.w / 2;
    p.x = Math.max(half, Math.min(this.W - half, p.x));
    if (this.bossPhase === 'extreme' || this.bossPhase === 'reaper') {
      // Boss「极限」/「死神」关：主角可上下移动，限制在屏幕内
      p.y = Math.max(half + 80, Math.min(this.H - half, p.y));
    } else {
      // 其余关卡：主角固定在底部附近，不做上下移动
      const baseY = this.H - 150;
      p.y += (baseY - p.y) * Math.min(1, dt * 4);
    }

    // 自动开火（空格/点击触发持续射击）；充能攻击降低射速 20%；进化Boss 复活金身期间 Boss 免疫伤害且不攻击（主角正常开火）
    // 缓行领域中主角射速同步渐缓（冷却时长随缓行系数拉长）
    const fireSlow = this.slowFieldActive > 0 ? this.slowFactor : 1;
    const chargeActive = this.skillChargeActive > 0;
    const effFireInterval = chargeActive ? this.fireInterval * SKILL_CHARGE_FIRE_MULT : this.fireInterval;
    this.fireCd -= dt * fireSlow;
    if ((this.shooting || this.autoFire) && this.fireCd <= 0) {
      this.fireBullet(chargeActive);
      this.fireCd = effFireInterval;
      // 副武器枪线：主魔法弹发射时同步触发一次副武器独立冷却
      if (this.weaponChosen) {
        if (this.weaponFireCd <= 0) {
          this.fireSecondaryBullet();
          const w = SECONDARY_WEAPONS[this.weaponChosen];
          this.weaponFireCd = w.interval;
        }
      }
    }
    if (this.weaponChosen && this.weaponFireCd > 0) {
      this.weaponFireCd = Math.max(0, this.weaponFireCd - dt * fireSlow);
    }

    // 大招：向前射出两列子弹（额外平行弹幕），持续期间高频发射
    if (this.skillUltActive > 0) {
      this.ultFireTimer -= dt * fireSlow;
      if (this.ultFireTimer <= 0) {
        this.ultFireTimer = 0.12;
        this.fireUltBullets();
      }
    }

    // 难度曲线：随时间 + 波次强化，刷怪越来越快、下坠越来越快
    const difficulty = Math.min(1, this.time / 90);
    const waveBoost = this.waveLevel * 0.12; // 每波额外提速
    this.spawnInterval = Math.max(0.35, 1.4 - difficulty * 0.9 - waveBoost); // 1.4s -> 更快
    this.speedMul = 1 + difficulty * 0.9 + waveBoost;

    // 被动卡牌效果：控制领域（低血降小怪移速 20%）/ 弹簧陷阱（20 怪时底端反弹）/ 破釜沉舟（低血+≥10 怪清屏）
    this.updatePassives(dt);

    // 波次强化闪光衰减
    if (this.waveFlash > 0) this.waveFlash = Math.max(0, this.waveFlash - dt);

    // 普通怪物刷新（Boss 关不刷普通怪，第 6 关进化Boss 不刷小怪）；关卡越高出怪越多
    const spawnMonsters = !this.boss;
    if (spawnMonsters) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        // 基础刷 1 只；第 2 关起每关温和增加出怪量（+1/关，上限 +3），难度可控
        const extra = Math.min(3, Math.max(0, this.stage - 1));
        for (let k = 0; k <= extra; k++) this.spawnMonster(difficulty);
        // 高波次时再额外多刷一只，制造节奏变化
        if (this.waveLevel >= 2 && Math.random() < 0.4) this.spawnMonster(difficulty);
        this.spawnTimer = this.spawnInterval * (0.7 + Math.random() * 0.6);
      }
      }
    // 金币掉落与拾取（靠近玩家自动吸取）
    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i];
      c.life -= dt;
      c.y += c.vy * dt;
      const dx = p.x - c.x;
      const dy = p.y - c.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 130) {
        // 吸取：向玩家加速靠近
        const pull = 620;
        c.x += (dx / (dist || 1)) * pull * dt;
        c.y += (dy / (dist || 1)) * pull * dt;
      }
      if (dist < p.w / 2 + 8) {
        this.coins.splice(i, 1);
        this.score += c.value;
        this.addFloat(c.x, c.y, `+${c.value}`, '#ffd24a');
        for (let k = 0; k < 5; k++) {
          const a = Math.random() * Math.PI * 2;
          this.particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90, life: 0.3, color: '#ffe27a', size: 3 });
        }
        continue;
      }
      if (c.life <= 0 || c.y > this.H + 20) this.coins.splice(i, 1);
    }

    // 子弹
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      if (b.vx) b.x += b.vx * dt;
      if (b.down) b.y += b.vy * dt;
      else b.y -= b.vy * dt;
      b.life -= dt;
      if (b.fromBoss) {
        // Boss 能量球命中玩家
        const dx = b.x - p.x;
        const dy = b.y - p.y;
        if (dx * dx + dy * dy < (b.r + p.w / 2) * (b.r + p.w / 2)) {
          this.bullets.splice(i, 1);
          if (this.isInvincible()) {
            this.addFloat(p.x, p.y - 50, '免疫', '#ffd24a');
            continue;
          }
          this.hp -= b.dmg;
          this.shake = 10;
          this.addFloat(p.x, p.y - 50, `-${b.dmg} HP`, '#ff5a5a');
          if (this.hp <= 0) {
            this.hp = 0;
            this.gameOver(false);
            return;
          }
          continue;
        }
      }
      if (b.y < -30 || b.y > this.H + 30 || b.life <= 0) this.bullets.splice(i, 1);
    }

    // 怪物
    for (let i = this.monsters.length - 1; i >= 0; i--) {
      const m = this.monsters[i];
      if (!m.elite) {
        m.y += m.speed * this.speedMul * dt;
        m.x += Math.sin(this.time * 2 + m.phase) * m.wobble * dt;
        m.x = Math.max(m.r, Math.min(this.W - m.r, m.x));
      } else {
        // 精英怪：不移动，周期性召唤小怪
        m.summonCd -= dt;
        if (m.summonCd <= 0) {
          m.summonCd = ELITE_SUMMON_INTERVAL;
          const count = 2 + Math.floor(Math.random() * 2); // 召唤 2~3 只小怪
          for (let k = 0; k < count; k++) this.spawnMonster(difficulty);
          this.addFloat(m.x, m.y - m.r - 16, '召唤！', '#ffb03c');
        }
      }
      m.flash -= dt;

      // 触底扣血（精英怪不移动，不会触底）
      if (!m.elite && m.y + m.r >= this.H - 40) {
        this.monsters.splice(i, 1);
        if (this.isInvincible()) {
          this.addFloat(p.x, p.y - 50, '免疫', '#ffd24a');
          continue;
        }
        this.hp -= m.dmg;
        this.shake = 8;
        this.addFloat(p.x, p.y - 50, `-${m.dmg} HP`, '#ff5a5a');
        if (this.hp <= 0) {
          this.hp = 0;
          this.gameOver(false);
          return;
        }
        continue;
      }

      // 子弹碰撞
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (b.fromBoss) continue;
        const dx = b.x - m.x;
        const dy = b.y - m.y;
        if (dx * dx + dy * dy < (m.r + b.r) * (m.r + b.r)) {
          this.bullets.splice(j, 1);
          m.hp -= b.dmg;
          m.flash = 0.1;
          if (m.hp <= 0) {
            this.killMonster(i);
            break;
          }
        }
      }
    }

    

    // Boss 更新与碰撞
    if (this.boss) {
      this.updateBoss(dt);
      const b = this.boss;
      // 玩家子弹命中 Boss
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const bl = this.bullets[j];
        if (bl.fromBoss) continue;
        const dx = bl.x - b.x;
        const dy = bl.y - b.y;
        if (dx * dx + dy * dy < (b.r + bl.r) * (b.r + bl.r)) {
          this.bullets.splice(j, 1);
          // 进化Boss 金身期间免疫伤害
          if (this.bossPhase === 'evolved' && this.evolvedInvulnRemaining > 0) {
            this.addFloat(bl.x, bl.y, '免疫', '#7ee6ff');
            continue;
          }
          b.hp -= bl.dmg;
          b.flash = 0.1;
          this.addFloat(bl.x, bl.y, `${bl.dmg}`, '#ffd24a');
          if (b.hp <= 0) {
            b.hp = 0;
            if (this.bossPhase === 'boss') {
              this.transformToPseudo();
            } else if (this.bossPhase === 'extreme') {
              // 击败 Boss「极限」-> 进入第 4 关小怪关（第 3 关结束后强制挑战）
              this.boss = null;
              this.bossPhase = 'normal';
              this.killField = false;
              this.bossHud.classList.add('hidden');
              this.stage = 4;
              this.enterNextStage();
              return;
            } else if (this.bossPhase === 'reaper') {
              // 击败伪最终 Boss「死神」-> 进入第 6 关进化Boss关卡（第一阶段为精英怪形态，300 血）
              this.spawnEvolvedBoss();
              return;
            } else if (this.bossPhase === 'evolved') {
              if (b.evoPhase === 1) {
                // 第一阶段（500 血）被打空 -> 清空场上残余小怪，Boss 满血进入第二阶段
                this.monsters = [];
                this.bossProjectiles = [];
                b.evoPhase = 2;
                b.maxHp = BOSS_EVOLVED.hp2;
                b.hp = BOSS_EVOLVED.hp2; // 第二阶段：满血 300
                b.flash = 0;
                b.attackCd = 1.5;
                // Boss 金身 3 秒：期间 Boss 不受伤害且不攻击（不再给主角金身）
                this.evolvedInvulnRemaining = EVOLVED_RESPAWN_INVULN;
                this.updateSkillBar();
                this.slowFieldActive = EVOLVED_SLOW_DURATION; // 10s 全屏缓行领域
                this.slowFieldElapsed = 0;
                this.slowFieldBlockUsed = false; // 每次领域释放重置一次格挡
                this.addFloat(this.W / 2, this.H / 2 - 60, '⚠ 进化Boss 进入第二阶段 · 缓行领域！', '#7ee6ff');
                for (let i = 0; i < 24; i++) {
                  const a = (i / 24) * Math.PI * 2;
                  this.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, life: 0.5, color: '#7ee6ff', size: 5 });
                }
              } else {
                // 第二阶段被击败 -> 播放第五幕告别剧情后通关胜利
                this.boss = null;
                this.bossPhase = 'normal';
                this.bossProjectiles = [];
                this.bossHud.classList.add('hidden');
                this.showStory('victory', [
                  { step: 5, text: '封印重新合拢了……深渊的风停了。做得好，孩子，真的做得好。' },
                  { step: 5, text: '你已经从学徒成长为真正的魔法师。这世间的安宁，就交给你守护了。—— 你的导师，艾泽尔' },
                ], () => this.gameOver(true));
              }
              return;
            } else {
              // 击败伪·永恒 -> 进入下一关小怪关（第 2~5 关），通关第 5 关进入最终 Boss「极限」
              this.boss = null;
              this.bossPhase = 'normal';
              this.bossHud.classList.add('hidden');
              // 第一次 Boss 关结束（击败伪·永恒）后弹出被动卡牌三选一，选择后再进入第 2 关
              if (!this.passiveChosen) {
                this.showPassiveSelect();
                return;
              }
              this.enterNextStage();
              return;
            }
            break;
          }
        }
      }
      if (this.boss) this.updateBossHud();
    }

    // Boss 登场提示计时
    if (this.bossBanner > 0) this.bossBanner -= dt;

    // 粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 300 * dt;
      pt.life -= dt;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // 漂浮文字
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y -= 40 * dt;
      ft.life -= dt;
      if (ft.life <= 0) this.floatingTexts.splice(i, 1);
    }

    if (this.shake > 0) this.shake = Math.max(0, this.shake - 30 * dt);

    this.updateHud();
    if (this.weaponChosen) this.updateWeaponPanel();
    this.updateStageProgressHud();
  }

  spawnMonster(difficulty) {
    const idx = Math.floor(Math.random() * MONSTER_TYPES.length);
    const t = MONSTER_TYPES[idx];
    const r = t.r;
    // 怪物血量逐关加厚（第 1 关为基准，第 2 关起每关 +10%，逐关叠加）
    const stageHpMul = 1 + Math.max(0, this.stage - 1) * 0.1;
    const hp = Math.max(1, Math.round(t.hp * stageHpMul));
    this.monsters.push({
      type: t,
      x: r + Math.random() * (this.W - r * 2),
      y: -r,
      r,
      hp,
      maxHp: hp,
      speed: t.speed * (0.85 + Math.random() * 0.3),
      exp: t.exp,
      dmg: t.dmg,
      wobble: 20 + difficulty * 40,
      phase: Math.random() * Math.PI * 2,
      flash: 0,
    });
  }

  fireBullet(charged) {
    const p = this.player;
    const dmg = charged ? Math.round(this.damage * SKILL_CHARGE_DMG_MULT) : this.damage;
    const slow = this.slowFieldActive > 0 ? this.slowFactor : 1;
    this.bullets.push({
      x: p.x,
      y: p.y - p.h / 2,
      vy: 520 * slow,
      r: charged ? 13 : 9,
      dmg,
      life: 2,
      charged: !!charged,
    });
  }

  // 大招：向前射出两列平行能量球（单个伤害为当前伤害的 30%）
  fireUltBullets() {
    const p = this.player;
    const off = p.w * 0.42;
    const ultDmg = Math.max(1, Math.round(this.damage * 0.3 * 10) / 10);
    const slow = this.slowFieldActive > 0 ? this.slowFactor : 1;
    for (const dx of [-off, off]) {
      this.bullets.push({
        x: p.x + dx,
        y: p.y - p.h / 2,
        vy: 560 * slow,
        r: 10,
        dmg: ultDmg,
        life: 2,
        ult: true,
      });
    }
  }

  killMonster(index) {
    const m = this.monsters[index];
    this.monsters.splice(index, 1);
    this.kills += 1;
    this.score += m.exp * 10;
    // 第 2、3、4、5 关：累计本关击杀进度，达成通关条件自动进入下一关（第 3 关后强制进入 Boss「极限」）
    const goal = STAGE_KILL_GOAL[this.stage];
    if (goal && !this.boss) {
      this.stageKills += 1;
      if (this.stageKills >= goal) {
        this.addFloat(this.W / 2, this.H / 2 - 40, `第 ${this.stage} 关通关！`, '#ffd24a');
        this.enterNextStage();
      }
    }
    this.gainExp(m.exp);
    // 爆裂粒子
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 160;
      this.particles.push({
        x: m.x, y: m.y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        life: 0.4 + Math.random() * 0.3,
        color: m.type.img === ASSETS.monsterGreen ? '#7ee06a' : m.type.img === ASSETS.monsterPurple ? '#b58cff' : '#ff7a5a',
        size: 3 + Math.random() * 4,
      });
    }
    this.addFloat(m.x, m.y, `+${m.exp} EXP`, '#ffd24a');
    // 掉落金币（可拾取加分）
    const coinCount = 1 + (Math.random() < 0.35 ? 1 : 0);
    for (let k = 0; k < coinCount; k++) {
      const a = Math.random() * Math.PI * 2;
      this.coins.push({
        x: m.x + Math.cos(a) * 10,
        y: m.y + Math.sin(a) * 10,
        vx: 0,
        vy: 60 + Math.random() * 60,
        value: 5 + Math.floor(Math.random() * 6),
        life: 6,
      });
    }
  }

  gainExp(amount) {
    this.exp += amount;
    while (this.exp >= this.expNeed) {
      this.exp -= this.expNeed;
      this.level += 1;
      this.expNeed = Math.round(this.expNeed * 1.35);
      // 攻击成长：第 1 关每升一级 +20%；第 2 关起每升一级 +1.5（初始攻击 5）
      if (this.stage >= 2) {
        this.damage = Math.round((this.damage + 1.5) * 100) / 100;
      } else {
        this.damage = Math.round((this.damage * 1.2) * 100) / 100;
      }
      this.fireInterval = Math.max(0.18, 0.5 - (this.level - 1) * 0.03);
      this.maxHp += 1;
      this.hp = this.maxHp;
      this.addFloat(this.player.x, this.player.y - 60, `LEVEL UP! Lv.${this.level}`, '#6ee7ff');
      // 每 10 级触发波次强化：怪物更快更多 + 全屏闪光提示
      const newWave = Math.floor(this.level / 10);
      if (newWave > this.waveLevel) {
        this.waveLevel = newWave;
        this.waveFlash = 0.9;
        this.addFloat(this.W / 2, this.H / 2 - 20, `第 ${newWave} 波 · 强化来袭！`, '#ff9a5a');
        for (let i = 0; i < 28; i++) {
          const a = (i / 28) * Math.PI * 2;
          this.particles.push({
            x: this.W / 2, y: this.H / 2,
            vx: Math.cos(a) * 360, vy: Math.sin(a) * 360,
            life: 0.6, color: '#ffb03c', size: 5,
          });
        }
      }
      // 升级光环粒子
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        this.particles.push({
          x: this.player.x, y: this.player.y,
          vx: Math.cos(a) * 180, vy: Math.sin(a) * 180,
          life: 0.5, color: '#6ee7ff', size: 4,
        });
      }
      // 达到 Boss 等级触发 Boss 关（保持原有行为，不改变触发条件）
      if (!this.bossTriggered && !this.boss && this.level >= BOSS_TRIGGER_LEVEL) {
        this.bossTriggered = true;
        this.spawnBoss();
      }
    }
  }

  addFloat(x, y, text, color) {
    this.floatingTexts.push({ x, y, text, color, life: 1 });
  }

  updateHud() {
    const set = (k, v) => {
      const el = this.hud.querySelector(`[data-k="${k}"]`);
      if (el) el.textContent = v;
    };
    set('lv', this.level);
    set('dmg', this.damage);
    set('kill', this.kills);
    set('score', this.score);
    const hpFill = this.hud.querySelector('.hp-fill');
    const expFill = this.hud.querySelector('.exp-fill');
    if (hpFill) hpFill.style.width = `${(this.hp / this.maxHp) * 100}%`;
    if (expFill) expFill.style.width = `${(this.exp / this.expNeed) * 100}%`;
  }

  // ---------- 渲染 ----------
  render() {
    const ctx = this.ctx;
    if (!ctx) return;
    ctx.clearRect(0, 0, this.W, this.H);
    ctx.save();
    if (this.shake > 0) {
      ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }

    // 背景
    if (this.images.bg) {
      const scale = Math.max(this.W / this.images.bg.width, this.H / this.images.bg.height);
      const dw = this.images.bg.width * scale;
      const dh = this.images.bg.height * scale;
      ctx.drawImage(this.images.bg, (this.W - dw) / 2, (this.H - dh) / 2, dw, dh);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, this.H);
      g.addColorStop(0, '#2a1a4a');
      g.addColorStop(1, '#ff9a5a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.W, this.H);
    }

    if (this.state === 'idle') {
      ctx.restore();
      return;
    }

    // 底部警戒线
    ctx.strokeStyle = 'rgba(255,90,90,0.5)';
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, this.H - 40);
    ctx.lineTo(this.W, this.H - 40);
    ctx.stroke();
    ctx.setLineDash([]);

    // 怪物
    for (const m of this.monsters) {
      const img = m.type.imgObj;
      const size = m.r * 2.4;
      if (img) {
        ctx.globalAlpha = m.flash > 0 ? 0.6 : 1;
        ctx.drawImage(img, m.x - size / 2, m.y - size / 2, size, size);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = m.type.img === ASSETS.monsterGreen ? '#7ee06a' : m.type.img === ASSETS.monsterPurple ? '#b58cff' : '#ff7a5a';
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }
      // 血条
      if (m.hp < m.maxHp) {
        const bw = m.r * 1.6;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(m.x - bw / 2, m.y - m.r - 12, bw, 5);
        ctx.fillStyle = '#ff5a5a';
        ctx.fillRect(m.x - bw / 2, m.y - m.r - 12, bw * (m.hp / m.maxHp), 5);
      }
    }

    // 陨石落点预警（预先标出位置与范围）
    for (const m of this.meteors) {
      const t = Math.max(0, m.warn / METEOR_WARNING); // 1 -> 0
      const pulse = 0.5 + Math.sin(this.time * 8) * 0.2;
      ctx.globalAlpha = 0.35 + pulse * 0.3;
      ctx.strokeStyle = '#ff8a3c';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#ff5a2a';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
      // 中心十字标记
      ctx.globalAlpha = 0.7 + pulse * 0.3;
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 3;
      const c = 16;
      ctx.beginPath();
      ctx.moveTo(m.x - c, m.y); ctx.lineTo(m.x + c, m.y);
      ctx.moveTo(m.x, m.y - c); ctx.lineTo(m.x, m.y + c);
      ctx.stroke();
      // 倒计时数字
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillStyle = '#fffbe0';
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 4;
      const txt = m.warn.toFixed(1);
      ctx.strokeText(txt, m.x, m.y - m.r - 12);
      ctx.fillText(txt, m.x, m.y - m.r - 12);
    }
    ctx.globalAlpha = 1;

    // 伪最终 Boss「死神」背景（随出场显现）
    if (this.bossPhase === 'reaper' && this.bgReaperAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = this.bgReaperAlpha * 0.55;
      if (this.images.bgReaper) {
        const scale = Math.max(this.W / this.images.bgReaper.width, this.H / this.images.bgReaper.height);
        const dw = this.images.bgReaper.width * scale;
        const dh = this.images.bgReaper.height * scale;
        ctx.drawImage(this.images.bgReaper, (this.W - dw) / 2, (this.H - dh) / 2, dw, dh);
      } else {
        const g = ctx.createLinearGradient(0, 0, 0, this.H);
        g.addColorStop(0, '#3a0a1a');
        g.addColorStop(1, '#0a0410');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, this.W, this.H);
      }
      ctx.restore();
    }

    // Boss
    if (this.boss) this.renderBoss(ctx);

    // 死神黑洞（吸入判定窗口内显示）
    if (this.reaperBlackhole) {
      const bh = this.reaperBlackhole;
      const pulse = 1 + Math.sin(this.time * 6) * 0.12;
      const R = REAPER_BLACKHOLE_RADIUS * pulse;
      const g = ctx.createRadialGradient(bh.x, bh.y, 0, bh.x, bh.y, R);
      g.addColorStop(0, 'rgba(10,4,30,0.95)');
      g.addColorStop(0.6, 'rgba(60,20,140,0.7)');
      g.addColorStop(1, 'rgba(120,80,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bh.x, bh.y, R, 0, Math.PI * 2);
      ctx.fill();
      // 吸力旋涡线
      ctx.strokeStyle = 'rgba(150,110,255,0.5)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = this.time * 3 + (i / 4) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, R * 0.7, a, a + 1.2);
        ctx.stroke();
      }
    }

    // 死神裂缝 / 黑洞光线
    for (const bm of this.reaperBeams) {
      if (bm.rift) {
        // 裂缝：紫色长条斩击
        const ang = Math.atan2(bm.vy, bm.vx);
        ctx.save();
        ctx.translate(bm.x, bm.y);
        ctx.rotate(ang);
        const g = ctx.createLinearGradient(-40, 0, 40, 0);
        g.addColorStop(0, 'rgba(181,140,255,0)');
        g.addColorStop(0.5, '#e0c8ff');
        g.addColorStop(1, 'rgba(181,140,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(-40, -bm.r, 80, bm.r * 2);
        ctx.restore();
      } else {
        // 黑洞光线：紫红色光束
        const g = ctx.createRadialGradient(bm.x, bm.y, 0, bm.x, bm.y, bm.r * 1.8);
        g.addColorStop(0, '#fff');
        g.addColorStop(0.5, '#9a6aff');
        g.addColorStop(1, 'rgba(120,80,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(bm.x, bm.y, bm.r * 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 进化Boss 弹丸：橙色直线弹丸
    for (const pr of this.bossProjectiles) {
      const g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, pr.r * 1.6);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.5, '#ff9a3c');
      g.addColorStop(1, 'rgba(255,154,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, pr.r * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // 子弹
    for (const b of this.bullets) {
      if (b.fromBoss) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.8);
        grad.addColorStop(0, '#fff0ff');
        grad.addColorStop(0.5, '#ff5ad0');
        grad.addColorStop(1, 'rgba(255,60,180,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 1.8, 0, Math.PI * 2);
        ctx.fill();
      } else if (b.ult) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.8);
        grad.addColorStop(0, '#eafcff');
        grad.addColorStop(0.5, '#6ee7ff');
        grad.addColorStop(1, 'rgba(60,180,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 1.8, 0, Math.PI * 2);
        ctx.fill();
      } else if (b.secondary) {
        const col = b.color || '#ffd24a';
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.2);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, col);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = col;
        ctx.fillRect(b.x - 2, b.y - 10, 4, 16);
      } else if (b.charged) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.9);
        grad.addColorStop(0, '#fffbe0');
        grad.addColorStop(0.5, '#ff9a3c');
        grad.addColorStop(1, 'rgba(255,120,30,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 1.9, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.8);
        grad.addColorStop(0, '#fffbe0');
        grad.addColorStop(0.5, '#ffd24a');
        grad.addColorStop(1, 'rgba(255,150,40,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 金币
    for (const c of this.coins) {
      const g = ctx.createRadialGradient(c.x - 2, c.y - 2, 1, c.x, c.y, 9);
      g.addColorStop(0, '#fffbe0');
      g.addColorStop(0.6, '#ffd24a');
      g.addColorStop(1, '#c98a1a');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,70,10,0.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // 治疗药水（程序化绘制：药水瓶形状，瞬时红色 / 缓慢绿色）
    for (const pt of this.potions) {
      const color = pt.type === 'instant' ? '#ff5a5a' : '#7ee6a0';
      const glow = ctx.createRadialGradient(pt.x, pt.y, 2, pt.x, pt.y, 14);
      glow.addColorStop(0, color);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 14, 0, Math.PI * 2);
      ctx.fill();
      // 瓶身
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(pt.x, pt.y + 2, 6, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // 瓶颈
      ctx.fillRect(pt.x - 2, pt.y - 8, 4, 6);
      // 瓶口
      ctx.fillStyle = '#fffbe0';
      ctx.fillRect(pt.x - 3, pt.y - 10, 6, 3);
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.ellipse(pt.x - 2, pt.y, 1.5, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 玩家
    const p = this.player;
    const heroImg = this.images.hero;
    const hs = p.w * 1.3;
    // 充能攻击：橙色能量光环
    if (this.skillChargeActive > 0) {
      const pulse = 0.5 + Math.sin(this.time * 8) * 0.5;
      const cg = ctx.createRadialGradient(p.x, p.y, p.w * 0.3, p.x, p.y, p.w * 1.1);
      cg.addColorStop(0, `rgba(255,176,60,${0.25 + pulse * 0.2})`);
      cg.addColorStop(1, 'rgba(255,176,60,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w * 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
    // 大招：青色双列弹幕光柱
    if (this.skillUltActive > 0) {
      const off = p.w * 0.42;
      for (const dx of [-off, off]) {
        const ug = ctx.createLinearGradient(0, p.y - p.h / 2, 0, 0);
        ug.addColorStop(0, 'rgba(110,231,255,0.5)');
        ug.addColorStop(1, 'rgba(110,231,255,0)');
        ctx.fillStyle = ug;
        ctx.fillRect(p.x + dx - 6, 0, 12, p.y - p.h / 2);
      }
    }
    if (heroImg) {
      ctx.drawImage(heroImg, p.x - hs / 2, p.y - hs / 2, hs, hs);
    } else {
      ctx.fillStyle = '#4aa8ff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // 绝对防御：金身金色发光护罩 + 倒计时
    if (this.skillDefenseActive > 0) {
      const pulse = 0.5 + Math.sin(this.time * 6) * 0.5;
      const gg = ctx.createRadialGradient(p.x, p.y, p.w * 0.4, p.x, p.y, p.w * 1.25);
      gg.addColorStop(0, `rgba(255,226,122,${0.35 + pulse * 0.25})`);
      gg.addColorStop(0.7, `rgba(255,176,60,${0.25 + pulse * 0.2})`);
      gg.addColorStop(1, 'rgba(255,176,60,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w * 1.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,226,122,${0.6 + pulse * 0.4})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w * 0.95, 0, Math.PI * 2);
      ctx.stroke();
      // 金身剩余秒数
      ctx.textAlign = 'center';
      ctx.font = 'bold 18px system-ui, sans-serif';
      ctx.fillStyle = '#fffbe0';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 3;
      const txt = String(Math.ceil(this.skillDefenseActive));
      ctx.strokeText(txt, p.x, p.y - p.w / 2 - 12);
      ctx.fillText(txt, p.x, p.y - p.w / 2 - 12);
    }

    // 粒子
    for (const pt of this.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / 0.7);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    // 漂浮文字
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px system-ui, sans-serif';
    for (const ft of this.floatingTexts) {
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.fillStyle = ft.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 3;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;

    // Boss 登场横幅
    if (this.bossBanner > 0) {
      const a = Math.min(1, this.bossBanner / 0.5);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.font = 'bold 40px system-ui, sans-serif';
      ctx.fillStyle = this.bossPhase === 'pseudo' ? '#eafcff' : this.bossPhase === 'extreme' ? '#ff4a4a' : '#ff5ad0';
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 6;
      ctx.strokeText(this.bossBannerText, this.W / 2, this.H / 2 - 80);
      ctx.fillText(this.bossBannerText, this.W / 2, this.H / 2 - 80);
      ctx.globalAlpha = 1;
    }

    // Eternity 全屏能量波表现（预警闪烁 + 命中冲击）
    if (this.bossPhase === 'boss') {
      if (this.waveWarning > 0) {
        const t = 1 - this.waveWarning / WAVE_WARNING; // 0->1 蓄力进度
        const pulse = 0.5 + Math.sin(t * Math.PI * 6) * 0.5;
        ctx.fillStyle = `rgba(255,60,180,${0.18 + t * 0.35})`;
        ctx.fillRect(0, 0, this.W, this.H);
        // 四边能量汇聚
        const edge = 30 + (1 - t) * 90;
        const eg = ctx.createLinearGradient(0, 0, 0, this.H);
        eg.addColorStop(0, `rgba(255,90,208,${0.7 * pulse})`);
        eg.addColorStop(0.5, 'rgba(255,90,208,0)');
        eg.addColorStop(1, `rgba(255,90,208,${0.7 * pulse})`);
        ctx.fillStyle = eg;
        ctx.fillRect(0, 0, this.W, edge);
        ctx.fillRect(0, this.H - edge, this.W, edge);
      } else {
        // 命中瞬间的白闪（利用 shake 衰减作为强度）
        const flash = Math.min(1, this.shake / 16);
        if (flash > 0) {
          ctx.fillStyle = `rgba(255,240,255,${flash * 0.6})`;
          ctx.fillRect(0, 0, this.W, this.H);
        }
      }
    }

    // 波次强化全屏闪光提示
    if (this.waveFlash > 0) {
      const a = Math.min(1, this.waveFlash / 0.9);
      ctx.fillStyle = `rgba(255,176,60,${a * 0.4})`;
      ctx.fillRect(0, 0, this.W, this.H);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.font = 'bold 34px system-ui, sans-serif';
      ctx.fillStyle = '#ffe27a';
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 5;
      ctx.strokeText(`第 ${this.waveLevel} 波`, this.W / 2, this.H / 2);
      ctx.fillText(`第 ${this.waveLevel} 波`, this.W / 2, this.H / 2);
      ctx.globalAlpha = 1;
    }

    // 杀戮领域：全屏暗红脉动 + 顶部封印提示（最终 Boss 半血启动）
    if (this.killField) {
      const pulse = 0.5 + Math.sin(this.time * 4) * 0.5;
      const kg = ctx.createRadialGradient(this.W / 2, this.H / 2, this.H * 0.2, this.W / 2, this.H / 2, this.H * 0.75);
      kg.addColorStop(0, 'rgba(80,0,0,0)');
      kg.addColorStop(1, `rgba(140,0,0,${0.35 + pulse * 0.2})`);
      ctx.fillStyle = kg;
      ctx.fillRect(0, 0, this.W, this.H);
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillStyle = `rgba(255,90,90,${0.7 + pulse * 0.3})`;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 4;
      ctx.strokeText('杀戮领域 · 技能封印中', this.W / 2, 110);
      ctx.fillText('杀戮领域 · 技能封印中', this.W / 2, 110);
    }

    ctx.restore();
  }

  renderBoss(ctx) {
    const b = this.boss;
    const isPseudo = this.bossPhase === 'pseudo';
    const isExtreme = this.bossPhase === 'extreme';
    const isReaper = this.bossPhase === 'reaper';
    const isEvolved = this.bossPhase === 'evolved';
    // 第 6 关进化Boss：精英怪形态（复用野猪精灵图，加载失败降级为橙色能量体）
    if (isEvolved) {
      // 缓行领域视觉：全屏淡蓝色渐变 + 边缘脉冲
      if (this.slowFieldActive > 0) {
        const remain = this.slowFieldActive / EVOLVED_SLOW_DURATION;
        const g = ctx.createRadialGradient(this.W / 2, this.H / 2, Math.min(this.W, this.H) * 0.2, this.W / 2, this.H / 2, Math.max(this.W, this.H) * 0.7);
        g.addColorStop(0, 'rgba(126,230,255,0)');
        g.addColorStop(1, `rgba(126,230,255,${0.18 * remain + 0.08})`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, this.W, this.H);
      }
      const pulse = 1 + Math.sin(b.phase * 2.5) * 0.05;
      const R = b.r * pulse;
      // Boss 金身：金色发光护罩
      if (this.evolvedInvulnRemaining > 0) {
        const gInv = ctx.createRadialGradient(b.x, b.y, R * 0.9, b.x, b.y, R * 1.6);
        gInv.addColorStop(0, 'rgba(255,210,74,0.05)');
        gInv.addColorStop(1, `rgba(255,210,74,${0.35 + Math.sin(b.phase * 8) * 0.08})`);
        ctx.fillStyle = gInv;
        ctx.beginPath();
        ctx.arc(b.x, b.y, R * 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      const halo = ctx.createRadialGradient(b.x, b.y, R * 0.2, b.x, b.y, R * 2.0);
      halo.addColorStop(0, 'rgba(255,154,60,0.55)');
      halo.addColorStop(0.6, 'rgba(180,90,30,0.35)');
      halo.addColorStop(1, 'rgba(180,90,30,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(b.x, b.y, R * 2.0, 0, Math.PI * 2);
      ctx.fill();
      if (this.images[ASSETS.eliteBoar]) {
        const size = b.r * 2.4;
        ctx.drawImage(this.images[ASSETS.eliteBoar], b.x - size / 2, b.y - size / 2, size, size);
      } else {
        const body = ctx.createRadialGradient(b.x - R * 0.3, b.y - R * 0.3, R * 0.1, b.x, b.y, R);
        body.addColorStop(0, '#ffe0b0');
        body.addColorStop(0.6, '#ff9a3c');
        body.addColorStop(1, '#a04a10');
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
        ctx.fill();
      }
      if (b.flash > 0) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      return;
    }
    // 伪最终 Boss「死神」：使用专属精灵图（加载失败降级为镰刀能量体）
    if (isReaper && this.images.bossReaper) {
      const pulse = 1 + Math.sin(b.phase * 2.5) * 0.05;
      const R = b.r * pulse;
      const halo = ctx.createRadialGradient(b.x, b.y, R * 0.2, b.x, b.y, R * 2.0);
      halo.addColorStop(0, 'rgba(255,74,74,0.55)');
      halo.addColorStop(0.6, 'rgba(120,30,80,0.35)');
      halo.addColorStop(1, 'rgba(120,30,80,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(b.x, b.y, R * 2.0, 0, Math.PI * 2);
      ctx.fill();
      ctx.drawImage(this.images.bossReaper, b.x - R, b.y - R * 1.2, R * 2, R * 2.4);
      ctx.restore();
      return;
    }
    // 最终 Boss「极限」：使用专属精灵图（加载失败降级为能量球）
    if (isExtreme && this.images.extreme) {
      const pulse = 1 + Math.sin(b.phase * 3) * 0.06;
      const R = b.r * pulse;
      const halo = ctx.createRadialGradient(b.x, b.y, R * 0.2, b.x, b.y, R * 1.9);
      halo.addColorStop(0, `rgba(255,74,74,${this.killField ? 0.65 : 0.4})`);
      halo.addColorStop(1, 'rgba(255,74,74,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(b.x, b.y, R * 1.9, 0, Math.PI * 2);
      ctx.fill();
      const size = b.r * 2.6;
      ctx.drawImage(this.images.extreme, b.x - size / 2, b.y - size / 2, size, size);
      if (b.flash > 0) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      return;
    }
    const core = isPseudo ? '#eafcff' : '#b58cff';
    const glow = isPseudo ? 'rgba(180,240,255,' : 'rgba(150,90,220,';
    const pulse = 1 + Math.sin(b.phase * 3) * 0.08;
    const R = b.r * pulse;
    // 外层光晕
    const halo = ctx.createRadialGradient(b.x, b.y, R * 0.2, b.x, b.y, R * 1.9);
    halo.addColorStop(0, glow + '0.55)');
    halo.addColorStop(1, glow + '0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(b.x, b.y, R * 1.9, 0, Math.PI * 2);
    ctx.fill();
    // 主体能量球
    const body = ctx.createRadialGradient(b.x - R * 0.3, b.y - R * 0.3, R * 0.1, b.x, b.y, R);
    body.addColorStop(0, isPseudo ? '#ffffff' : '#f0d8ff');
    body.addColorStop(0.6, core);
    body.addColorStop(1, isPseudo ? '#9fd8f0' : '#5a2a9a');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.fill();
    // 核心眼睛
    ctx.fillStyle = isPseudo ? '#ffffff' : '#ffe0ff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, R * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = isPseudo ? '#2a6a9a' : '#3a0a5a';
    ctx.beginPath();
    ctx.arc(b.x, b.y, R * 0.16, 0, Math.PI * 2);
    ctx.fill();
    // 受击闪白
    if (b.flash > 0) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 伪·永恒蓄力预警：向玩家汇聚的蓝色能量环 + 准星连线
    if (isPseudo && this.pseudoCharge > 0) {
      const t = 1 - this.pseudoCharge / PSEUDO_CHARGE; // 0->1 蓄力进度
      const p = this.player;
      // 指向玩家的光束线（逐渐变亮）
      ctx.strokeStyle = `rgba(126,230,255,${0.2 + t * 0.7})`;
      ctx.lineWidth = 3 + t * 8;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      // 中心汇聚的能量环
      const ringR = R * (1.9 - t * 1.4);
      ctx.strokeStyle = `rgba(126,230,255,${0.4 + t * 0.6})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(b.x, b.y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      // 核心变亮
      ctx.fillStyle = `rgba(255,255,255,${t * 0.8})`;
      ctx.beginPath();
      ctx.arc(b.x, b.y, R * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- 输入 ----------
  onKeyDown = (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'a' || k === 'A' || k === 'd' || k === 'D' || k === 'w' || k === 'W' || k === 's' || k === 'S') {
      this.keys.add(k);
      e.preventDefault();
    }
    if (k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      if (this.state === 'playing') this.shooting = true;
    }
    // 技能快捷键：1 绝对防御 / 2 充能攻击 / 3 大招
    if (this.state === 'playing') {
      if (k === '1') this.useSkill('defense');
      else if (k === '2') this.useSkill('charge');
      else if (k === '3') this.useSkill('ult');
    }
  };

  onKeyUp = (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'a' || k === 'A' || k === 'd' || k === 'D' || k === 'w' || k === 'W' || k === 's' || k === 'S') {
      this.keys.delete(k);
    }
    if (k === ' ' || k === 'Spacebar') this.shooting = false;
  };

  canvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return e.clientX - rect.left;
  }

  canvasPosY(e) {
    const rect = this.canvas.getBoundingClientRect();
    return e.clientY - rect.top;
  }

  onPointerDown = (e) => {
    if (this.state !== 'playing') return;
    this.touchX = this.canvasPos(e);
    if (this.bossPhase === 'extreme' || this.bossPhase === 'reaper') this.touchY = this.canvasPosY(e);
    this.autoFire = true;
    try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
  };

  onPointerMove = (e) => {
    if (this.state !== 'playing' || !this.autoFire && this.touchX === null) return;
    if (e.pointerType === 'touch' || this.touchX !== null) {
      this.touchX = this.canvasPos(e);
      if (this.bossPhase === 'extreme' || this.bossPhase === 'reaper') this.touchY = this.canvasPosY(e);
    }
  };

  onPointerUp = () => {
    this.autoFire = false;
    this.touchX = null;
    this.touchY = null;
  };

  destroy() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('keyup', this.onKeyUp);
    this.canvas.removeEventListener('pointerdown', this.onPointerDown);
    this.canvas.removeEventListener('pointermove', this.onPointerMove);
    window.removeEventListener('pointerup', this.onPointerUp);
    window.removeEventListener('pointercancel', this.onPointerUp);
  }
}

// 装配入口：挂载游戏到 #app

const app = document.getElementById('app');
const game = new Game(app);
window.__game = game;
</script>
